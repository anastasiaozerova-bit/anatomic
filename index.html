*{margin:0;padding:0;box-sizing:border-box}
:root{

html,body{height:100%;overflow:hidden}
body{

  color:var(--text);
  display:flex;
  flex-direction:column;

}
.header{padding:20px 24px 0;flex-shrink:0}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6c9bff,#a78bfa,#f97316);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 0 20px rgba(108,155,255,.3)}

.header-text p{font-size:12px;color:var(--text3);margin-top:2px;letter-spacing:.3px}
.tabs-wrap{padding:16px 24px 0;flex-shrink:0}
.tabs-scroll{max-width:1200px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:6px;min-width:max-content}
.tab{padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:all .2s;position:relative}
.tab:hover{background:var(--surface2);color:var(--text);border-color:#3a4060}
.tab.active{background:var(--surface2);color:#fff;border-color:var(--tab-color,var(--accent));box-shadow:0 0 16px rgba(108,155,255,.15),inset 0 1px 0 rgba(255,255,255,.06)}
.tab.active::after{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:2px;background:var(--tab-color,var(--accent))}
.tab .tab-icon{font-size:16px}
.tab .tab-num{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text3)}
.tab.active .tab-num{background:var(--tab-color,var(--accent));color:#fff}
.divider{height:1px;background:var(--border);margin:8px 0 0;flex-shrink:0}
.content{flex:1;overflow:hidden;position:relative}
.content iframe{width:100%;height:100%;border:none;display:none;background:#fff}
.content iframe.active{display:block}
@media(max-width:640px){
  .header{padding:14px 16px 0}
  .header-inner{gap:10px}
  .logo{width:34px;height:34px;font-size:17px;border-radius:10px}
  .header-text h1{font-size:15px}
  .header-text p{font-size:11px}
  .tabs-wrap{padding:12px 16px 0}
  .tab{padding:8px 12px;font-size:12px;border-radius:8px;gap:6px}
  .tab .tab-icon{font-size:14px}
  .tab .tab-num{width:18px;height:18px;font-size:10px;border-radius:5px}
  .tab .tab-label{display:none}
}
</style>

      &lt;text x=&quot;60&quot; y=&quot;204&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;• Ретикулярная формация&lt;/text&gt;
      &lt;text x=&quot;60&quot; y=&quot;220&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;• Гипоталамус, мозжечок&lt;/text&gt;

      &lt;text x=&quot;60&quot; y=&quot;248&quot; fill=&quot;#e2e8f0&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Сегментарные (4 очага):&lt;/text&gt;
      &lt;text x=&quot;60&quot; y=&quot;265&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;• Мезенцефалич., понто-бульб. (ПС)&lt;/text&gt;
      &lt;text x=&quot;60&quot; y=&quot;281&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;• Тораколюмбальн. (С), сакральн. (ПС)&lt;/text&gt;

      &lt;text x=&quot;480&quot; y=&quot;155&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;1. Висцерорецепторы&lt;/text&gt;
      &lt;text x=&quot;480&quot; y=&quot;172&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;2. Вегетативные нервы&lt;/text&gt;
      &lt;text x=&quot;480&quot; y=&quot;189&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;3. Нервные волокна&lt;/text&gt;
      &lt;text x=&quot;480&quot; y=&quot;206&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;   (пре- и постганглионарные)&lt;/text&gt;
      &lt;text x=&quot;480&quot; y=&quot;226&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;4. Вегетативные ганглии (I, II, III)&lt;/text&gt;
      &lt;text x=&quot;480&quot; y=&quot;246&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;5. Вегетативные сплетения&lt;/text&gt;
      &lt;text x=&quot;480&quot; y=&quot;263&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;   (сосудистые и внутриорганные)&lt;/text&gt;

      &lt;rect x=&quot;280&quot; y=&quot;92&quot; width=&quot;180&quot; height=&quot;38&quot; rx=&quot;8&quot; fill=&quot;rgba(16,185,129,.12)&quot; stroke=&quot;#10b981&quot;/&gt;
      &lt;text x=&quot;370&quot; y=&quot;116&quot; text-anchor=&quot;middle&quot; fill=&quot;#10b981&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;ТРИ ОТДЕЛА&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;Симпатич.&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;Парасимпатич.&lt;/text&gt;
      &lt;text x=&quot;370&quot; y=&quot;189&quot; text-anchor=&quot;middle&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;Метасимпатич.&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;h3&gt;Сегментарные центры — 4 очага&lt;/h3&gt;

  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Очаг&lt;/th&gt;&lt;th&gt;Отдел&lt;/th&gt;&lt;th&gt;Ядра&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag red&quot;&gt;Мезенцефалический&lt;/span&gt; (парасимп.)&lt;/td&gt;&lt;td&gt;Средний мозг&lt;/td&gt;&lt;td&gt;Добавочное ядро III пары &lt;span class=&quot;lat&quot;&gt;nucl. accessorius&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag red&quot;&gt;Понто-бульбарный&lt;/span&gt; (парасимп.)&lt;/td&gt;&lt;td&gt;Мост, продолговатый мозг&lt;/td&gt;&lt;td&gt;Верх. и ниж. слюноотделит. ядра (VII, IX), дорсальное ядро X пары&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag blue&quot;&gt;Тораколюмбальный&lt;/span&gt; (симпатич.)&lt;/td&gt;&lt;td&gt;Спинной мозг&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;nucl. intermediolaterales&lt;/span&gt;, C8–L2&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;tag red&quot;&gt;Сакральный&lt;/span&gt; (парасимп.)&lt;/td&gt;&lt;td&gt;Спинной мозг&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;nucl. parasympathici sacrales&lt;/span&gt;, S2–S4&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h3&gt;Вегетативная рефлекторная дуга&lt;/h3&gt;

  &lt;div class=&quot;memo-box&quot;&gt;
    &lt;strong&gt;Главное отличие от соматической дуги:&lt;/strong&gt; эфферентная часть состоит из &lt;strong&gt;двух нейронов&lt;/strong&gt;. Третий (эффекторный) нейрон лежит &lt;strong&gt;вне ЦНС&lt;/strong&gt; — в вегетативном ганглии.
  &lt;/div&gt;

  &lt;div class=&quot;pathway&quot;&gt;
    &lt;span class=&quot;step&quot;&gt;Рецептор (висцерорецептор)&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;1-й нейрон (спинномозг. узел)&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;2-й нейрон (бок. рога / ядра ствола)&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Преганглионарное волокно&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;3-й нейрон (вегет. ганглий)&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Постганглионарное волокно&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Орган&lt;/span&gt;
  &lt;/div&gt;

  &lt;h3&gt;Вегетативные ганглии&lt;/h3&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Порядок&lt;/th&gt;&lt;th&gt;Название&lt;/th&gt;&lt;th&gt;Принадлежность&lt;/th&gt;&lt;th&gt;Локализация&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;I&lt;/td&gt;&lt;td&gt;Околопозвоночные &lt;span class=&quot;lat&quot;&gt;gangll. paravertebralia&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag blue&quot;&gt;Симпатич.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Вдоль позвоночника (симп. ствол)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;II&lt;/td&gt;&lt;td&gt;Предпозвоночные &lt;span class=&quot;lat&quot;&gt;gangll. prevertebralia&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag blue&quot;&gt;Симпатич.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Впереди аорты (чревные, брыжеечные)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;III&lt;/td&gt;&lt;td&gt;Конечные &lt;span class=&quot;lat&quot;&gt;gangll. terminalia&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag red&quot;&gt;Парасимп.&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Около/внутри иннервируемых органов&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h3&gt;Медиаторы ВНС&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;p&gt;&lt;strong&gt;Все преганглионарные волокна&lt;/strong&gt; (и симп., и парасимп.) выделяют &lt;strong&gt;ацетилхолин&lt;/strong&gt; → действует на &lt;strong&gt;Н-холинорецепторы&lt;/strong&gt; ганглиев.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Постганглионарные парасимпатические&lt;/strong&gt; → &lt;strong&gt;ацетилхолин&lt;/strong&gt; → &lt;strong&gt;М-холинорецепторы&lt;/strong&gt; (блокируются атропином).&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Постганглионарные симпатические&lt;/strong&gt; → &lt;strong&gt;норадреналин&lt;/strong&gt; → &lt;strong&gt;α- и β-адренорецепторы&lt;/strong&gt;.&lt;/p&gt;
    &lt;p style=&quot;color:var(--accent3);font-size:.9rem;&quot;&gt;⚠ Исключения: симпатич. к потовым железам и вазодилататорам — тоже ацетилхолин (М-рец.).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Вегетативные волокна&lt;/h3&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Тип&lt;/th&gt;&lt;th&gt;Миелин&lt;/th&gt;&lt;th&gt;Диаметр&lt;/th&gt;&lt;th&gt;Скорость&lt;/th&gt;&lt;th&gt;Цвет ветвей&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Преганглионарные&lt;/td&gt;&lt;td&gt;✓ есть&lt;/td&gt;&lt;td&gt;1,5–5 мкм&lt;/td&gt;&lt;td&gt;1,5–20 м/с&lt;/td&gt;&lt;td&gt;Белые (rr. communicantes albi)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Постганглионарные&lt;/td&gt;&lt;td&gt;✗ нет&lt;/td&gt;&lt;td&gt;0,5–2,5 мкм&lt;/td&gt;&lt;td&gt;0,5–3 м/с&lt;/td&gt;&lt;td&gt;Серые (rr. communicantes grisei)&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;div class=&quot;memo-box&quot;&gt;
    &lt;strong&gt;Белые соединительные ветви&lt;/strong&gt; — есть только у нервов, выходящих из С8–L2 (где есть симп. ядра).&lt;br&gt;
    &lt;strong&gt;Серые соединительные ветви&lt;/strong&gt; — входят в состав &lt;strong&gt;всех&lt;/strong&gt; спинномозговых нервов.
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- =================== СИМПАТИЧЕСКИЙ ОТДЕЛ =================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;sympathetic&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-icon&quot; style=&quot;background:rgba(249,115,22,.12);color:var(--accent3);&quot;&gt;⚡&lt;/div&gt;
    &lt;h2&gt;Симпатический отдел&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Центральный отдел: &lt;span class=&quot;lat&quot;&gt;nucl. intermediolaterales&lt;/span&gt; в боковых рогах спинного мозга, уровень &lt;strong&gt;C8–L2&lt;/strong&gt;.&lt;/p&gt;

  &lt;h3&gt;Симпатический ствол &lt;span class=&quot;lat&quot;&gt;truncus sympathicus&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Парное образование из &lt;strong&gt;17–22 узлов&lt;/strong&gt;, соединённых межузловыми ветвями. Тянется от основания черепа до копчика, где оба ствола сливаются в &lt;strong&gt;непарный копчиковый узел&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;ganglion impar&lt;/span&gt;.&lt;/p&gt;

  &lt;h4&gt;Шейный отдел (3 узла)&lt;/h4&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Узел&lt;/th&gt;&lt;th&gt;Локализация&lt;/th&gt;&lt;th&gt;Серые rr. к&lt;/th&gt;&lt;th&gt;Висцеральные ветви&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Верхний&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;g. cervicale sup.&lt;/span&gt; (1,5–2 см)&lt;/td&gt;&lt;td&gt;У C2–C3 позвонков&lt;/td&gt;&lt;td&gt;C1–C4&lt;/td&gt;&lt;td&gt;Внутр./наруж. сонные спл., яремное спл., верх. серд. нерв, гортанно-глоточные нн.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Средний&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;g. cervicale medium&lt;/span&gt; (непост.)&lt;/td&gt;&lt;td&gt;У C6 позвонка&lt;/td&gt;&lt;td&gt;C5–C6&lt;/td&gt;&lt;td&gt;Средний серд. нерв&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Нижний&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;g. cervicale inf.&lt;/span&gt; (непост.)&lt;/td&gt;&lt;td&gt;У C7 — головка I ребра&lt;/td&gt;&lt;td&gt;C7–C8&lt;/td&gt;&lt;td&gt;Нижний серд. нерв, подкл. спл., позвоночное спл.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;div class=&quot;memo-box&quot;&gt;
    Нижний шейный узел часто сливается с верхним грудным → &lt;strong&gt;звёздчатый узел&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;g. cervicothoracicum (stellatum)&lt;/span&gt;, тогда серые rr. к C8–Th1.
  &lt;/div&gt;

  &lt;h4&gt;Грудной отдел (9–12 узлов)&lt;/h4&gt;
  &lt;p&gt;Ко всем узлам подходят &lt;strong&gt;белые&lt;/strong&gt; соединительные ветви. Висцеральные: сердечные нн. (от 5 верхних), лёгочные rr., средостенные rr. И главное:&lt;/p&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Нерв&lt;/th&gt;&lt;th&gt;Источник&lt;/th&gt;&lt;th&gt;Куда идёт&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Большой внутренностный&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;n. splanchnicus major&lt;/span&gt;&lt;/td&gt;&lt;td&gt;V–IX грудные узлы&lt;/td&gt;&lt;td&gt;Чревное (солнечное) сплетение&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Малый внутренностный&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;n. splanchnicus minor&lt;/span&gt;&lt;/td&gt;&lt;td&gt;X–XI грудные узлы&lt;/td&gt;&lt;td&gt;Чревное спл. + аортопочечные узлы&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Низший внутренностный&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;n. splanchnicus imus&lt;/span&gt; (непост.)&lt;/td&gt;&lt;td&gt;XII грудной узел&lt;/td&gt;&lt;td&gt;Почечное сплетение&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h4&gt;Поясничный отдел (3–5 узлов)&lt;/h4&gt;
  &lt;p&gt;Белые rr. только к L1–L2. От узлов: серые rr. к поясничным нервам + &lt;span class=&quot;lat&quot;&gt;nn. splanchnici lumbales&lt;/span&gt; → предпозвоночные сплетения брюшной полости.&lt;/p&gt;

  &lt;h4&gt;Крестцовый (тазовый) отдел (4 узла)&lt;/h4&gt;
  &lt;p&gt;Серые rr. к крестцовым нервам + &lt;span class=&quot;lat&quot;&gt;nn. splanchnici sacrales&lt;/span&gt; → подчревные сплетения.&lt;/p&gt;

  &lt;h3&gt;Предпозвоночные (превертебральные) сплетения&lt;/h3&gt;
  &lt;div class=&quot;card highlight&quot;&gt;
    &lt;div class=&quot;card-title&quot; style=&quot;color:var(--accent);&quot;&gt;Чревное (солнечное) сплетение — «мозг брюшной полости»&lt;/div&gt;
    &lt;p&gt;Расположено вокруг чревного ствола в виде подковы. Содержит: 2 чревных узла, 2 аортопочечных узла, верхний брыжеечный узел. К нему подходят большой и малый внутренностные нн., ветви блуждающего нерва, правого диафрагмального нерва.&lt;/p&gt;
    &lt;p&gt;От него отходят вторичные сплетения: печёночное, селезёночное, желудочные, поджелудочное, надпочечниковые, диафрагмальное, почечное, верхнее брыжеечное.&lt;/p&gt;
  &lt;/div&gt;
  &lt;p&gt;&lt;strong&gt;Нижнее брыжеечное сплетение&lt;/strong&gt; → левая половина толстой кишки, сигмовидная, верхняя часть прямой кишки.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;Верхнее подчревное сплетение&lt;/strong&gt; → делится на правый и левый подчревные нервы → &lt;strong&gt;нижнее подчревное (тазовое) сплетение&lt;/strong&gt; — одно из крупнейших, иннервирует органы малого таза.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- =================== ПАРАСИМПАТИЧЕСКИЙ ОТДЕЛ =================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;parasympathetic&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-icon&quot; style=&quot;background:rgba(244,63,94,.12);color:var(--accent5);&quot;&gt;🕊&lt;/div&gt;
    &lt;h2&gt;Парасимпатический отдел&lt;/h2&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card warn&quot;&gt;
    &lt;div class=&quot;card-title&quot; style=&quot;color:var(--accent3);&quot;&gt;Что НЕ получает парасимпатическую иннервацию&lt;/div&gt;
    &lt;p&gt;Скелетная мускулатура, ЦНС, большая часть кровеносных сосудов, потовые и сальные железы.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Краниальный отдел — 5 парасимпатических ганглиев&lt;/h3&gt;

  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Ганглий&lt;/th&gt;&lt;th&gt;Черепной нерв&lt;/th&gt;&lt;th&gt;Ядро&lt;/th&gt;&lt;th&gt;Путь волокон&lt;/th&gt;&lt;th&gt;Иннервация&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;
      &lt;td&gt;&lt;strong&gt;Ресничный&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;lat&quot;&gt;g. ciliare&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;III (глазодвигат.)&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;lat&quot;&gt;nucl. accessorius&lt;/span&gt; (Якубовича)&lt;/td&gt;
      &lt;td&gt;n. oculomotorius → парасимп. корешок&lt;/td&gt;
      &lt;td&gt;m. sphincter pupillae, m. ciliaris (аккомодация)&lt;/td&gt;
    &lt;/tr&gt;
    &lt;tr&gt;
      &lt;td&gt;&lt;strong&gt;Крылонёбный&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;lat&quot;&gt;g. pterygopalatinum&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;VII (лицевой)&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;lat&quot;&gt;nucl. salivatorius sup.&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;n. facialis → n. petrosus major → n. pterygoideus (Видиев)&lt;/td&gt;
      &lt;td&gt;Слёзная железа, железы слизистой носа, нёба, глотки&lt;/td&gt;
    &lt;/tr&gt;
    &lt;tr&gt;
      &lt;td&gt;&lt;strong&gt;Поднижнечелюст.&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;lat&quot;&gt;g. submandibulare&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;VII (лицевой)&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;lat&quot;&gt;nucl. salivatorius sup.&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;n. facialis → chorda tympani → n. lingualis&lt;/td&gt;
      &lt;td&gt;Поднижнечелюстная слюнная железа&lt;/td&gt;
    &lt;/tr&gt;
    &lt;tr&gt;
      &lt;td&gt;&lt;strong&gt;Подъязычный&lt;/strong&gt; (непост.)&lt;br&gt;&lt;span class=&quot;lat&quot;&gt;g. sublinguale&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;VII (лицевой)&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;lat&quot;&gt;nucl. salivatorius sup.&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;Тот же путь (chorda tympani)&lt;/td&gt;
      &lt;td&gt;Подъязычная слюнная железа&lt;/td&gt;
    &lt;/tr&gt;
    &lt;tr&gt;
      &lt;td&gt;&lt;strong&gt;Ушной&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;lat&quot;&gt;g. oticum&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;IX (языкоглот.)&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;lat&quot;&gt;nucl. salivatorius inf.&lt;/span&gt;&lt;/td&gt;
      &lt;td&gt;n. glossophar. → n. tympanicus → plexus tymp. → n. petrosus minor&lt;/td&gt;
      &lt;td&gt;Околоушная слюнная железа&lt;/td&gt;
    &lt;/tr&gt;
  &lt;/table&gt;

  &lt;div class=&quot;memo-box&quot;&gt;
    &lt;strong&gt;Для запоминания:&lt;/strong&gt; через каждый ганглий проходят транзитом также чувствительные (от ветвей V пары) и симпатические (от сплетений на сонных артериях) волокна — они НЕ переключаются в ганглии.
  &lt;/div&gt;

  &lt;h4&gt;Блуждающий нерв &lt;span class=&quot;lat&quot;&gt;n. vagus&lt;/span&gt; (X пара)&lt;/h4&gt;
  &lt;p&gt;Самый крупный парасимпатический нерв. Ядро: &lt;span class=&quot;lat&quot;&gt;nucl. dorsalis n. vagi&lt;/span&gt; в продолговатом мозге. Преганглионарные волокна идут к внутриорганным (интрамуральным) ганглиям органов шеи, грудной и брюшной полостей. Иннервирует: гортань, глотку, пищевод, желудок, кишечник (до левого изгиба толстой кишки), сердце, лёгкие, печень, поджелудочную железу.&lt;/p&gt;

  &lt;h4&gt;Крестцовая часть&lt;/h4&gt;
  &lt;p&gt;Ядра: &lt;span class=&quot;lat&quot;&gt;nucl. parasympathici sacrales&lt;/span&gt;, S2–S4. Волокна → &lt;span class=&quot;lat&quot;&gt;nn. splanchnici pelvini&lt;/span&gt; → нижнее подчревное сплетение → тазовые ганглии → органы малого таза (мочевой пузырь, прямая кишка ниже левого изгиба, половые органы).&lt;/p&gt;

  &lt;h3&gt;Сравнение симпатического и парасимпатического отделов&lt;/h3&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Признак&lt;/th&gt;&lt;th&gt;&lt;span class=&quot;tag blue&quot;&gt;Симпатический&lt;/span&gt;&lt;/th&gt;&lt;th&gt;&lt;span class=&quot;tag red&quot;&gt;Парасимпатический&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Функция&lt;/td&gt;&lt;td&gt;Мобилизация, органостимуляция&lt;/td&gt;&lt;td&gt;Покой, органоохрана, гомеостаз&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Область иннервации&lt;/td&gt;&lt;td&gt;Повсеместная&lt;/td&gt;&lt;td&gt;Ограниченная (нет скелетных мышц, ЦНС, большинства сосудов)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Центры&lt;/td&gt;&lt;td&gt;Тораколюмбальный (C8–L2)&lt;/td&gt;&lt;td&gt;Краниальные (III, VII, IX, X) + сакральный (S2–S4)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Ганглии&lt;/td&gt;&lt;td&gt;I порядка (паравертебр.) + II порядка (превертебр.)&lt;/td&gt;&lt;td&gt;III порядка (конечные, около/внутри органов)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Длина преганглион.&lt;/td&gt;&lt;td&gt;Короткие&lt;/td&gt;&lt;td&gt;Длинные&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Длина постганглион.&lt;/td&gt;&lt;td&gt;Длинные&lt;/td&gt;&lt;td&gt;Короткие&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Медиатор постганглион.&lt;/td&gt;&lt;td&gt;Норадреналин (α, β-рец.)&lt;/td&gt;&lt;td&gt;Ацетилхолин (М-рец.)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Сплетения&lt;/td&gt;&lt;td&gt;Первичные (сосудистые)&lt;/td&gt;&lt;td&gt;Вторичные (внутриорганные)&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
&lt;/div&gt;

&lt;!-- =================== КОЖА =================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;skin&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-icon&quot; style=&quot;background:rgba(16,185,129,.12);color:var(--accent4);&quot;&gt;🧤&lt;/div&gt;
    &lt;h2&gt;Кожа и её производные&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Кожа — сложнейшая чувствительная система. Общая поверхность: ~1,5–1,8 м². Более 3 миллионов болевых рецепторов. На 1 см² кожи: 2 тепловых, 12 холодовых, 25 осязательных, 150 болевых точек.&lt;/p&gt;

  &lt;h3&gt;Строение кожи&lt;/h3&gt;
  &lt;div class=&quot;schema&quot;&gt;
    &lt;svg viewBox=&quot;0 0 700 260&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;
      &lt;rect x=&quot;50&quot; y=&quot;10&quot; width=&quot;600&quot; height=&quot;40&quot; rx=&quot;6&quot; fill=&quot;rgba(249,115,22,.12)&quot; stroke=&quot;#f97316&quot;/&gt;
      &lt;text x=&quot;350&quot; y=&quot;35&quot; text-anchor=&quot;middle&quot; fill=&quot;#f97316&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;ЭПИДЕРМИС (из эктодермы)&lt;/text&gt;
      &lt;text x=&quot;55&quot; y=&quot;68&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;11&quot;&gt;Роговой слой → Блестящий → Зернистый (кератогиалин) → Ростковый (Мальпигиев) с пигментом&lt;/text&gt;

      &lt;rect x=&quot;50&quot; y=&quot;85&quot; width=&quot;600&quot; height=&quot;40&quot; rx=&quot;6&quot; fill=&quot;rgba(108,155,255,.12)&quot; stroke=&quot;#6c9bff&quot;/&gt;
      &lt;text x=&quot;350&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot; fill=&quot;#6c9bff&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;ДЕРМА (из мезодермы)&lt;/text&gt;

      &lt;rect x=&quot;80&quot; y=&quot;135&quot; width=&quot;260&quot; height=&quot;32&quot; rx=&quot;5&quot; fill=&quot;rgba(108,155,255,.06)&quot; stroke=&quot;#2a2f42&quot;/&gt;
      &lt;text x=&quot;210&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; fill=&quot;#e2e8f0&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;12&quot;&gt;Сосочковый слой&lt;/text&gt;

      &lt;rect x=&quot;360&quot; y=&quot;135&quot; width=&quot;260&quot; height=&quot;32&quot; rx=&quot;5&quot; fill=&quot;rgba(108,155,255,.06)&quot; stroke=&quot;#2a2f42&quot;/&gt;
      &lt;text x=&quot;490&quot; y=&quot;155&quot; text-anchor=&quot;middle&quot; fill=&quot;#e2e8f0&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;12&quot;&gt;Сетчатый (ретикулярный) слой&lt;/text&gt;

      &lt;text x=&quot;80&quot; y=&quot;185&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;10.5&quot;&gt;Капилляры, нерв. окончания,&lt;/text&gt;
      &lt;text x=&quot;80&quot; y=&quot;198&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;10.5&quot;&gt;протоки потовых желёз&lt;/text&gt;
      &lt;text x=&quot;360&quot; y=&quot;185&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;10.5&quot;&gt;Соединит. ткань + эластич.&lt;/text&gt;
      &lt;text x=&quot;360&quot; y=&quot;198&quot; fill=&quot;#94a3b8&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;10.5&quot;&gt;+ гладкомыш. волокна (mm. arrectores pili)&lt;/text&gt;

      &lt;rect x=&quot;50&quot; y=&quot;215&quot; width=&quot;600&quot; height=&quot;35&quot; rx=&quot;6&quot; fill=&quot;rgba(167,139,250,.1)&quot; stroke=&quot;#a78bfa&quot;/&gt;
      &lt;text x=&quot;350&quot; y=&quot;237&quot; text-anchor=&quot;middle&quot; fill=&quot;#a78bfa&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;ПОДКОЖНАЯ ОСНОВА (гиподерма) — жировые дольки&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;h3&gt;Рецепторы кожи&lt;/h3&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Тип&lt;/th&gt;&lt;th&gt;Рецепторы&lt;/th&gt;&lt;th&gt;Что воспринимают&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Терморецепторы&lt;/td&gt;&lt;td&gt;Колбы Краузе (холод), тельца Руффини (тепло)&lt;/td&gt;&lt;td&gt;Температурные изменения&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Механорецепторы&lt;/td&gt;&lt;td&gt;Тельца Мейснера (прикосновение), тельца Фатер-Пачини (давление, вибрация), диски Меркеля&lt;/td&gt;&lt;td&gt;Механические стимулы&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Ноцирецепторы&lt;/td&gt;&lt;td&gt;Свободные нервные окончания&lt;/td&gt;&lt;td&gt;Боль&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h3&gt;Проводящий путь кожной чувствительности&lt;/h3&gt;
  &lt;div class=&quot;pathway&quot;&gt;
    &lt;span class=&quot;step&quot;&gt;Рецепторы кожи&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;1-й нейрон (спинномозг. узел)&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Задние рога спинного мозга&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Перекрёст&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Спино-таламический путь&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Латеральные ядра таламуса&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Задняя центральная извилина&lt;/span&gt;
  &lt;/div&gt;
  &lt;p style=&quot;font-size:.88rem;color:var(--text2);&quot;&gt;Вибрация и тактильная чувствительность: по тонкому и клиновидному пучкам → одноимённые ядра продолг. мозга → медиальная петля → таламус → кора.&lt;/p&gt;

  &lt;h3&gt;Производные кожи&lt;/h3&gt;

  &lt;div class=&quot;grid-2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0;&quot;&gt;Волосы &lt;span class=&quot;lat&quot;&gt;pili&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Корень (в коже) + стержень (над кожей). Производные эпидермиса.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0;&quot;&gt;Ногти &lt;span class=&quot;lat&quot;&gt;ungues&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Ногтевая пластинка + ногтевое ложе. Рост от ложа.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Железы кожи&lt;/h4&gt;
  &lt;p&gt;&lt;strong&gt;Сальные&lt;/strong&gt; — при волосяных фолликулах. &lt;strong&gt;Потовые&lt;/strong&gt; — по всей поверхности тела. &lt;strong&gt;Молочные&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;mammae&lt;/span&gt; — производные потовых желёз.&lt;/p&gt;

  &lt;div class=&quot;card green&quot;&gt;
    &lt;div class=&quot;card-title&quot; style=&quot;color:var(--accent4);&quot;&gt;Молочная железа — кратко&lt;/div&gt;
    &lt;p&gt;Расположение: на фасции большой грудной мышцы, III–V ребро. Состоит из 15–20 долей альвеолярно-трубчатого строения, расположенных радиарно. Млечные ходы открываются на вершине соска (10–15 протоков).&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Лимфоотток&lt;/strong&gt; (важно клинически!): подмышечный путь (~80%), парастернальный, подключичный, позадигрудинный, перекрёстный.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- =================== ЗРЕНИЕ =================== --&gt;

      &lt;text x=&quot;560&quot; y=&quot;215&quot; fill=&quot;#64748b&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;9&quot;&gt;(слепое пятно)&lt;/text&gt;

      &lt;!-- Chambers --&gt;
      &lt;text x=&quot;140&quot; y=&quot;150&quot; fill=&quot;#64748b&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;8&quot;&gt;Передн.&lt;/text&gt;
      &lt;text x=&quot;140&quot; y=&quot;158&quot; fill=&quot;#64748b&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;8&quot;&gt;камера&lt;/text&gt;
      &lt;text x=&quot;175&quot; y=&quot;155&quot; fill=&quot;#64748b&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;8&quot;&gt;Задн.&lt;/text&gt;
      &lt;text x=&quot;175&quot; y=&quot;163&quot; fill=&quot;#64748b&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;8&quot;&gt;камера&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;h4&gt;1. Фиброзная оболочка &lt;span class=&quot;lat&quot;&gt;tunica fibrosa&lt;/span&gt;&lt;/h4&gt;
  &lt;div class=&quot;grid-2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Роговица&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;cornea&lt;/span&gt; (1/6) — прозрачная, нет сосудов, коллагеновые волокна параллельны → хорошо трансплантируется.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Склера&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;sclera&lt;/span&gt; (5/6) — каркас, защита. На границе — &lt;strong&gt;Шлеммов канал&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;sinus venosus sclerae&lt;/span&gt; (циркуляция водянистой влаги).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;2. Сосудистая оболочка &lt;span class=&quot;lat&quot;&gt;tunica vasculosa&lt;/span&gt;&lt;/h4&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Часть&lt;/th&gt;&lt;th&gt;Функция&lt;/th&gt;&lt;th&gt;Ключевое&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Радужка&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;iris&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Диафрагма (зрачок)&lt;/td&gt;&lt;td&gt;m. sphincter pupillae (суживает, ПС) + m. dilatator pupillae (расширяет, С). Пигмент → цвет глаз.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Ресничное тело&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;corpus ciliare&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Аккомодация + продукция водянистой влаги&lt;/td&gt;&lt;td&gt;60–80 ресничных отростков; ресничная мышца (мерид.+радиальные+циркул. волокна); Циннова связка → хрусталик.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Собственно сосудистая&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;choroidea&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Кровоснабжение, синтез зрит. пурпура&lt;/td&gt;&lt;td&gt;Самые крупные капиллярные сплетения в организме.&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h4&gt;3. Сетчатка &lt;span class=&quot;lat&quot;&gt;retina&lt;/span&gt;&lt;/h4&gt;
  &lt;div class=&quot;card highlight&quot;&gt;
    &lt;p&gt;&lt;strong&gt;Зрительная часть&lt;/strong&gt; (кзади от &lt;span class=&quot;lat&quot;&gt;ora serrata&lt;/span&gt;) — содержит фоторецепторы:&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Палочки&lt;/strong&gt; — содержат зрительный пурпур, сумеречное (ночное) зрение.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Колбочки&lt;/strong&gt; — дневное зрение, цвет, форма. Максимально в жёлтом пятне &lt;span class=&quot;lat&quot;&gt;macula lutea&lt;/span&gt;.&lt;/p&gt;
    &lt;p style=&quot;margin-top:.6rem;&quot;&gt;Три слоя нейронов: 1-й — палочки/колбочки → 2-й — биполярные клетки → 3-й — ганглиозные клетки (аксоны = зрительный нерв).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h4&gt;Ядро глаза&lt;/h4&gt;
  &lt;p&gt;&lt;strong&gt;Хрусталик&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;lens&lt;/span&gt; — двояковыпуклая линза, аккомодация. С возрастом теряет воду → дальнозоркость; помутнение → катаракта.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;Стекловидное тело&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;corpus vitreum&lt;/span&gt; — 99% вода, фиксирует хрусталик и прижимает сетчатку.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;Водянистая влага&lt;/strong&gt; — вырабатывается ресничными отростками → задняя камера → через зрачок → передняя камера → Фонтановы пространства → Шлеммов канал → вортикозные вены. Нарушение оттока → ↑ давление → &lt;strong&gt;глаукома&lt;/strong&gt;.&lt;/p&gt;

  &lt;h4&gt;Вспомогательный аппарат&lt;/h4&gt;
  &lt;p&gt;&lt;strong&gt;6 мышц:&lt;/strong&gt; 4 прямых (верхняя, нижняя, медиальная, латеральная) + 2 косых (верхняя, нижняя). Все, кроме нижней косой, от &lt;span class=&quot;lat&quot;&gt;anulus tendineus communis&lt;/span&gt;.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;Веки&lt;/strong&gt; — защита. Основа — хрящевая пластинка &lt;span class=&quot;lat&quot;&gt;tarsus&lt;/span&gt;. Мейбомиевы железы (сальные). M. levator palpebrae superioris.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;Слёзный аппарат:&lt;/strong&gt; слёзная железа → протоки → конъюнктива → слёзный ручей → слёзное озеро → слёзные канальцы → слёзный мешок → носослёзный проток &lt;span class=&quot;lat&quot;&gt;ductus nasolacrimalis&lt;/span&gt; → нижний носовой ход.&lt;/p&gt;
&lt;/div&gt;

&lt;!-- =================== СЛУХ =================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;hearing&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-icon&quot; style=&quot;background:rgba(244,63,94,.12);color:var(--accent5);&quot;&gt;👂&lt;/div&gt;
    &lt;h2&gt;Орган слуха и равновесия&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Состоит из трёх частей: наружного, среднего и внутреннего уха.&lt;/p&gt;

  &lt;h3&gt;Наружное ухо&lt;/h3&gt;
  &lt;p&gt;&lt;strong&gt;Ушная раковина&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;auricula&lt;/span&gt;: хрящ + кожа. Завиток, противозавиток, козелок, противокозелок, мочка (без хряща, жир).&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;Наружный слуховой проход&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;meatus acusticus ext.&lt;/span&gt;: S-образный, хрящевая + костная части. Серные железы &lt;span class=&quot;lat&quot;&gt;gll. ceruminosae&lt;/span&gt;.&lt;/p&gt;
  &lt;p&gt;&lt;strong&gt;Барабанная перепонка&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;membrana tympani&lt;/span&gt;: коническая мембрана. Пупок (центр). Ненатянутая часть &lt;span class=&quot;lat&quot;&gt;pars flaccida&lt;/span&gt; (сверху) + натянутая &lt;span class=&quot;lat&quot;&gt;pars tensa&lt;/span&gt;.&lt;/p&gt;

  &lt;h3&gt;Среднее ухо&lt;/h3&gt;
  &lt;h4&gt;Барабанная полость &lt;span class=&quot;lat&quot;&gt;cavitas tympanica&lt;/span&gt;&lt;/h4&gt;
  &lt;p&gt;Неправильный куб с 6 стенками:&lt;/p&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Стенка&lt;/th&gt;&lt;th&gt;Название&lt;/th&gt;&lt;th&gt;Особенности&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Латеральная&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;paries membranacea&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Барабанная перепонка&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Медиальная&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;paries labyrinthica&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Мыс &lt;span class=&quot;lat&quot;&gt;promontorium&lt;/span&gt; (стенка улитки), барабанное сплетение&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Верхняя&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;paries tegmentalis&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Тонкая, щели → контакт с твёрдой мозговой оболочкой!&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Нижняя&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;paries jugularis&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Яремная ямка, recessus hypotympanicus&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Передняя&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;paries carotica&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Устье слуховой трубы, канал m. tensor tympani&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Задняя&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;paries mastoidea&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Связь с ячейками сосцевидного отростка → риск мастоидита&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h4&gt;Слуховые косточки&lt;/h4&gt;
  &lt;div class=&quot;pathway&quot;&gt;
    &lt;span class=&quot;step&quot;&gt;Молоточек &lt;span class=&quot;lat&quot;&gt;malleus&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;⟶&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Наковальня &lt;span class=&quot;lat&quot;&gt;incus&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;⟶&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Стремечко &lt;span class=&quot;lat&quot;&gt;stapes&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;⟶&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Окно преддверия&lt;/span&gt;
  &lt;/div&gt;
  &lt;p&gt;Две мышцы: &lt;strong&gt;m. tensor tympani&lt;/strong&gt; (от V₃, усиливает передачу) и &lt;strong&gt;m. stapedius&lt;/strong&gt; (от VII, уменьшает передачу) — баланс звукопередачи.&lt;/p&gt;

  &lt;h4&gt;Слуховая (Евстахиева) труба&lt;/h4&gt;
  &lt;p&gt;Соединяет барабанную полость с носоглоткой. Длина 3,5–4 см. Костная + хрящевая части. Выравнивает давление. Открывается при глотании.&lt;/p&gt;

  &lt;h3&gt;Внутреннее ухо&lt;/h3&gt;
  &lt;p&gt;&lt;strong&gt;Костный лабиринт&lt;/strong&gt; (в пирамиде височной кости) содержит &lt;strong&gt;перепончатый лабиринт&lt;/strong&gt;. Между ними — перилимфа, внутри перепончатого — эндолимфа.&lt;/p&gt;

  &lt;h4&gt;Три части костного лабиринта:&lt;/h4&gt;

  &lt;div class=&quot;grid-2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0;&quot;&gt;Преддверие &lt;span class=&quot;lat&quot;&gt;vestibulum&lt;/span&gt;&lt;/h4&gt;
      &lt;p&gt;Центральная часть. Два кармана: сферический &lt;span class=&quot;lat&quot;&gt;recessus sphericus&lt;/span&gt; (→ мешочек) и эллиптический &lt;span class=&quot;lat&quot;&gt;recessus ellipticus&lt;/span&gt; (→ маточка). Два окна: окно преддверия (стремечко) и окно улитки (вторичная барабанная перепонка).&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4 style=&quot;margin-top:0;&quot;&gt;Полукружные каналы (3)&lt;/h4&gt;
      &lt;p&gt;Передний, задний, латеральный — в 3 взаимно ⊥ плоскостях. Каждый имеет ампулу. Передний + задний → общая ножка. Открываются в преддверье 5 отверстиями.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card highlight&quot;&gt;
    &lt;h4 style=&quot;margin-top:0;&quot;&gt;Улитка &lt;span class=&quot;lat&quot;&gt;cochlea&lt;/span&gt;&lt;/h4&gt;
    &lt;p&gt;Костная трубка, 2,5 оборота вокруг стержня &lt;span class=&quot;lat&quot;&gt;modiolus&lt;/span&gt;. Костная спиральная пластинка + базальная мембрана + мембрана преддверия делят канал на:&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Лестница преддверия&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;scala vestibuli&lt;/span&gt; (сверху) и &lt;strong&gt;барабанная лестница&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;scala tympani&lt;/span&gt; (снизу). Между ними — &lt;strong&gt;улитковый проток&lt;/strong&gt; (треугольный, содержит Кортиев орган).&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Кортиев орган&lt;/strong&gt; — на базальной мембране. Чувствительные волосковые клетки + опорные клетки. Нервные волокна → спиральный узел &lt;span class=&quot;lat&quot;&gt;ganglion spirale&lt;/span&gt; (1-й нейрон слухового пути).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h4&gt;Перепончатый лабиринт — рецепторы&lt;/h4&gt;
  &lt;table&gt;
    &lt;tr&gt;&lt;th&gt;Рецептор&lt;/th&gt;&lt;th&gt;Где&lt;/th&gt;&lt;th&gt;Что воспринимает&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Пятна &lt;span class=&quot;lat&quot;&gt;macula utriculi / sacculi&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Маточка, мешочек&lt;/td&gt;&lt;td&gt;Гравитация, линейное ускорение (статическое равновесие)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Гребни &lt;span class=&quot;lat&quot;&gt;cristae ampullares&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Ампулы полукружных протоков&lt;/td&gt;&lt;td&gt;Угловое ускорение (динамическое равновесие)&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;Кортиев орган&lt;/td&gt;&lt;td&gt;Улитковый проток&lt;/td&gt;&lt;td&gt;Звуковые колебания&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;

  &lt;h3&gt;Путь проведения звука&lt;/h3&gt;
  &lt;div class=&quot;pathway&quot;&gt;
    &lt;span class=&quot;step&quot;&gt;Звуковые волны&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Нар. слуховой проход&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Барабанная перепонка&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Слуховые косточки&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Перилимфа преддверия&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Лестница преддверия ↑&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Геликотрема&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Барабанная лестница ↓&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
    &lt;span class=&quot;step&quot;&gt;Окно улитки (гашение)&lt;/span&gt;
  &lt;/div&gt;
  &lt;p&gt;Колебания перилимфы → эндолимфа → базальная мембрана → &lt;strong&gt;Кортиев орган&lt;/strong&gt; (механич. → электрич. сигнал).&lt;/p&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot; style=&quot;color:var(--accent);&quot;&gt;Циркуляция лимфы&lt;/div&gt;
    &lt;p&gt;&lt;strong&gt;Перилимфа&lt;/strong&gt; (≈ плазма) → по перилимфатическому пространству → отток через &lt;span class=&quot;lat&quot;&gt;ductus perilymphaticus&lt;/span&gt; → субарахноидальное пространство. &lt;em&gt;Менингит → может осложниться лабиринтитом!&lt;/em&gt;&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;Эндолимфа&lt;/strong&gt; (богата К⁺, ≈ цитоплазма) → замкнутая система перепончатого лабиринта → &lt;span class=&quot;lat&quot;&gt;ductus endolymphaticus&lt;/span&gt; → водопровод преддверия → &lt;span class=&quot;lat&quot;&gt;saccus endolymphaticus&lt;/span&gt; (между листками ТМО, резорбция).&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- =================== ВКУС =================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;taste&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-icon&quot; style=&quot;background:rgba(249,115,22,.12);color:var(--accent3);&quot;&gt;👅&lt;/div&gt;
    &lt;h2&gt;Вкусовой анализатор&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Периферическая часть — &lt;strong&gt;вкусовые почки&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;caliculus gustatorius&lt;/span&gt;: модифицированные эпителиальные клетки (вторичные чувствительные), окружённые опорными клетками.&lt;/p&gt;

  &lt;h3&gt;Локализация вкусовых почек&lt;/h3&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;p&gt;Больше всего — в &lt;strong&gt;желобовидных сосочках&lt;/strong&gt; языка. Также: листовидные и грибовидные сосочки, мягкое нёбо, нёбно-язычные дужки, надгортанник, стенка ротовой части глотки.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Зоны вкуса на языке&lt;/h3&gt;
  &lt;div class=&quot;schema&quot;&gt;
    &lt;svg viewBox=&quot;0 0 400 320&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;
      &lt;!-- Tongue shape --&gt;
      &lt;path d=&quot;M 200 30 Q 120 30 100 80 Q 80 130 85 180 Q 90 240 120 275 Q 160 310 200 315 Q 240 310 280 275 Q 310 240 315 180 Q 320 130 300 80 Q 280 30 200 30 Z&quot; fill=&quot;rgba(244,63,94,.08)&quot; stroke=&quot;#f43f5e&quot; stroke-width=&quot;2&quot;/&gt;

      &lt;!-- Sweet - tip --&gt;
      &lt;ellipse cx=&quot;200&quot; cy=&quot;285&quot; rx=&quot;50&quot; ry=&quot;20&quot; fill=&quot;rgba(108,155,255,.15)&quot; stroke=&quot;#6c9bff&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;200&quot; y=&quot;290&quot; text-anchor=&quot;middle&quot; fill=&quot;#6c9bff&quot; font-family=&quot;Source Sans 3&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Сладкое&lt;/text&gt;

      &lt;!-- Salty --&gt;

// Active nav on scroll
const sections = document.querySelectorAll('.section');
const navLinks = document.querySelectorAll('nav a');
const observer = new IntersectionObserver(entries =&gt; {
  entries.forEach(entry =&gt; {
    if (entry.isIntersecting) {
      navLinks.forEach(l =&gt; l.classList.remove('active'));

    }
  });
}, { rootMargin: '-20% 0px -70% 0px' });

function getTypeColor(type) {
  switch(type) {
    case 'sensory': return 'var(--accent-sensory)';
    case 'motor': return 'var(--accent-motor)';
    case 'mixed': return 'var(--accent-mixed)';
    default: return 'var(--text-dim)';
  }
}
function getTypeBg(type) {
  switch(type) {
    case 'sensory': return 'var(--accent-sensory-bg)';
    case 'motor': return 'var(--accent-motor-bg)';
    case 'mixed': return 'var(--accent-mixed-bg)';
    default: return 'transparent';
  }
}
function getInnClass(t) {
  if (t === 'Д') return 'inn-m';
  if (t === 'Ч') return 'inn-s';
  if (t === 'Пс') return 'inn-p';
  if (t === 'Смеш') return 'inn-mx';
  return '';
}

      &lt;li&gt;&lt;span class=&quot;lat&quot;&gt;A. palatina descendens&lt;/span&gt; (нисходящая нёбная) — через большой нёбный канал к нёбу и прилежащим тканям&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;info-card blue&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;🔵 Из системы внутренней сонной артерии (ВСА)&lt;/div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;span class=&quot;lat&quot;&gt;A. ethmoidalis anterior&lt;/span&gt; (передняя решётчатая) — от глазной артерии. Кровоснабжает боковую стенку полости носа и переднюю часть перегородки&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lat&quot;&gt;A. ethmoidalis posterior&lt;/span&gt; (задняя решётчатая) — от глазной артерии. Кровоснабжает решётчатые ячейки и заднюю часть полости носа&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lat&quot;&gt;A. dorsalis nasi&lt;/span&gt; — спинка носа&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;section&quot;&gt;
  &lt;h3&gt;Кровоснабжение наружного носа&lt;/h3&gt;
  &lt;div class=&quot;info-card green&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Наружный нос&lt;/div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;span class=&quot;lat&quot;&gt;A. dorsalis nasi&lt;/span&gt; (от глазной → ВСА)&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lat&quot;&gt;R. lateralis nasi&lt;/span&gt; (от лицевой → НСА)&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lat&quot;&gt;R. septi nasi&lt;/span&gt; (от лицевой → НСА)&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;mnemonic&quot;&gt;
  &lt;div class=&quot;mnemonic-label&quot;&gt;🧠 Важный анастомоз&lt;/div&gt;
  &lt;p&gt;В полости носа — &lt;span class=&quot;lat&quot;&gt;a. sphenopalatina&lt;/span&gt; (НСА) ↔ &lt;span class=&quot;lat&quot;&gt;aa. ethmoidales ant. et post.&lt;/span&gt; (ВСА) — клинически важный анастомоз между системами НСА и ВСА&lt;/p&gt;
  &lt;p style=&quot;margin-top:8px;color:var(--text2)&quot;&gt;Зона Киссельбаха (передне-нижний отдел перегородки) — место наиболее частых носовых кровотечений из-за густого сосудистого сплетения&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;section&quot;&gt;
  &lt;h3&gt;Строение полости носа (кратко)&lt;/h3&gt;
  &lt;div class=&quot;info-card purple&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Стенки полости носа&lt;/div&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;strong&gt;Верхняя:&lt;/strong&gt; носовая часть лобной кости, &lt;span class=&quot;lat&quot;&gt;lamina cribrosa&lt;/span&gt; решётчатой, тело клиновидной&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Нижняя:&lt;/strong&gt; нёбный отросток верхней челюсти + горизонтальная пластинка нёбной кости (= твёрдое нёбо)&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Латеральная:&lt;/strong&gt; носовая кость, лабиринт решётчатой, нижняя носовая раковина, перпендикулярная пластинка нёбной кости&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Медиальная (перегородка):&lt;/strong&gt; перпендикулярная пластинка решётчатой + сошник + хрящ перегородки&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
  
  &lt;h4&gt;Носовые ходы и пазухи:&lt;/h4&gt;
  &lt;div class=&quot;table-wrap&quot;&gt;
    &lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Носовой ход&lt;/th&gt;&lt;th&gt;Что открывается&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Нижний&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;Canalis nasolacrimalis&lt;/span&gt; (носослёзный канал)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Средний&lt;/td&gt;&lt;td&gt;Верхнечелюстная (гайморова) пазуха, лобная пазуха, передние и средние решётчатые ячейки&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Верхний&lt;/td&gt;&lt;td&gt;Задние решётчатые ячейки, клиновидная пазуха&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;
&lt;/div&gt;
`,

&lt;div class=&quot;topic-header&quot;&gt;

  &lt;p&gt;Барабанная полость получает кровь из &lt;span class=&quot;key&quot;&gt;нескольких источников&lt;/span&gt;, что обеспечивает богатые анастомозы:&lt;/p&gt;
  &lt;div class=&quot;table-wrap&quot;&gt;
    &lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Артерия&lt;/th&gt;&lt;th&gt;Источник&lt;/th&gt;&lt;th&gt;Путь проникновения&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;A. tympanica anterior&lt;/span&gt;&lt;/td&gt;&lt;td&gt;A. maxillaris (нижнечелюстная часть)&lt;/td&gt;&lt;td&gt;Через &lt;span class=&quot;lat&quot;&gt;fissura petrotympanica&lt;/span&gt; (каменисто-барабанная щель)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;A. tympanica inferior&lt;/span&gt;&lt;/td&gt;&lt;td&gt;A. pharyngea ascendens (НСА)&lt;/td&gt;&lt;td&gt;Через нижнюю стенку&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Ветвь &lt;span class=&quot;lat&quot;&gt;a. auricularis posterior&lt;/span&gt;&lt;/td&gt;&lt;td&gt;НСА&lt;/td&gt;&lt;td&gt;Через &lt;span class=&quot;lat&quot;&gt;for. stylomastoideum&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;lat&quot;&gt;Rr. caroticotympanicae&lt;/span&gt;&lt;/td&gt;&lt;td&gt;A. carotis interna&lt;/td&gt;&lt;td&gt;Из сонного канала&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Ветвь &lt;span class=&quot;lat&quot;&gt;a. meningea media&lt;/span&gt;&lt;/td&gt;&lt;td&gt;A. maxillaris&lt;/td&gt;&lt;td&gt;К слуховой трубе и стенкам&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;info-card yellow&quot;&gt;
  &lt;div class=&quot;card-title&quot;&gt;⚠️ Анастомозы в барабанной полости&lt;/div&gt;
  &lt;p&gt;Барабанная полость — место анастомоза между системами &lt;span class=&quot;key&quot;&gt;ВСА&lt;/span&gt; (&lt;span class=&quot;lat&quot;&gt;rr. caroticotympanicae&lt;/span&gt;) и &lt;span class=&quot;key&quot;&gt;НСА&lt;/span&gt; (&lt;span class=&quot;lat&quot;&gt;a. tympanica anterior, a. tympanica inferior&lt;/span&gt;). Это клинически важно при тромбозе одной из систем.&lt;/p&gt;

&lt;div class=&quot;section&quot;&gt;
  &lt;h3&gt;Стенки барабанной полости (для ориентации)&lt;/h3&gt;
  &lt;div class=&quot;info-card purple&quot;&gt;

      &lt;li&gt;&lt;strong&gt;Нижняя (яремная)&lt;/strong&gt; — прилежит к &lt;span class=&quot;lat&quot;&gt;bulbus v. jugularis&lt;/span&gt;&lt;/li&gt;

      &lt;li&gt;&lt;strong&gt;Задняя (сосцевидная)&lt;/strong&gt; — вход в сосцевидную пещеру&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;topic-header&quot;&gt;

  &lt;p&gt;Наружное ухо включает &lt;span class=&quot;key&quot;&gt;ушную раковину&lt;/span&gt; (&lt;span class=&quot;lat&quot;&gt;auricula&lt;/span&gt;) и &lt;span class=&quot;key&quot;&gt;наружный слуховой проход&lt;/span&gt; (&lt;span class=&quot;lat&quot;&gt;meatus acusticus externus&lt;/span&gt;). Заканчивается барабанной перепонкой (&lt;span class=&quot;lat&quot;&gt;membrana tympanica&lt;/span&gt;).&lt;/p&gt;

&lt;!-- ==================== ЧАСТЬ 1 ==================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;part1&quot;&gt;
  &lt;h2&gt;1. Лимфатические узлы головы и шеи — 10 групп&lt;/h2&gt;
  &lt;p&gt;Лимфатические сосуды головы и шеи собираются в правый и левый &lt;b&gt;яремные лимфатические стволы&lt;/b&gt;, trunci jugulares dexter et sinister. Правый ствол впадает в правый лимфатический проток (ductus lymphaticus dexter), левый — в грудной проток (ductus thoracicus).&lt;/p&gt;

  &lt;table class=&quot;node-table&quot;&gt;
    &lt;thead&gt;
      &lt;tr&gt;&lt;th&gt;№&lt;/th&gt;&lt;th&gt;Группа узлов&lt;/th&gt;&lt;th&gt;Топография&lt;/th&gt;&lt;/tr&gt;
    &lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;
        &lt;td&gt;1&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Затылочные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici occipitales&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;Подкожная клетчатка на уровне верхней выйной линии&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;2&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Сосцевидные (заушные)&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici mastoidei&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;Позади ушной раковины, на сосцевидном отростке&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;3&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Поднижнечелюстные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici submandibulares&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;В поднижнечелюстном треугольнике (trigonum submandibulare), часть — в толще поднижнечелюстной слюнной железы&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;4&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Подподбородочные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici submentales&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;Выше тела подъязычной кости, на передней поверхности mm. mylohyoidei&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;5&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Нижнечелюстные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici mandibulares&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;На наружной поверхности нижней челюсти&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;6&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Околоушные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici parotidei superficiales et profundi&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;В окружности и в толще околоушной слюнной железы (поверхностные и глубокие)&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;7&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Щечные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici buccales&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;В области щеки&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;8&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Язычные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici linguales&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;По бокам корня языка&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;9&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Передние шейные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici cervicales anteriores&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Поверхностные&lt;/b&gt; — по ходу наружной яремной вены и позади m. sternocleidomastoideus.&lt;br&gt;
        &lt;b&gt;Глубокие&lt;/b&gt; — предгортанные, пре- и паратрахеальные, щитовидные&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;10&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Латеральные шейные&lt;/b&gt;&lt;span class=&quot;lat&quot;&gt;nodi lymphatici cervicales laterales&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;&lt;b&gt;Поверхностные&lt;/b&gt; и &lt;b&gt;глубокие&lt;/b&gt; (надключичные, заглоточные, передние и латеральные яремные узлы около v. jugularis interna)&lt;/td&gt;
      &lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;

  &lt;div class=&quot;key-box&quot;&gt;
    &lt;strong&gt;💡 Для запоминания:&lt;/strong&gt; Узлы головы идут «полукольцом» от затылка через ухо к подбородку. Шейные узлы делятся на передние и латеральные, каждые — на поверхностные и глубокие.
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ==================== ЧАСТЬ 3 ==================== --&gt;
&lt;div class=&quot;section accent-red&quot; id=&quot;part3&quot;&gt;
  &lt;h2&gt;3. Лимфатический отток от образований головы и шеи&lt;/h2&gt;
  &lt;p&gt;Каждая область головы отдаёт лимфу в определённые региональные узлы. Ниже — подробная карта оттока:&lt;/p&gt;

  &lt;h3&gt;🔹 Отток от областей головы&lt;/h3&gt;
  &lt;table class=&quot;node-table&quot;&gt;
    &lt;thead&gt;
      &lt;tr&gt;&lt;th&gt;Область / орган&lt;/th&gt;&lt;th&gt;Региональные лимфоузлы&lt;/th&gt;&lt;/tr&gt;
    &lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;
        &lt;td&gt;Затылочная область&lt;/td&gt;
        &lt;td&gt;→ &lt;b&gt;Затылочные&lt;/b&gt; узлы&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Ушная раковина + задние отделы теменной и затылочной обл.&lt;/td&gt;
        &lt;td&gt;→ &lt;b&gt;Сосцевидные&lt;/b&gt; узлы&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Лоб, передние отделы теменной и височной обл., наружный слуховой проход, барабанная перепонка, часть век, часть ушной раковины&lt;/td&gt;
        &lt;td&gt;→ &lt;b&gt;Околоушные&lt;/b&gt; узлы&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Кости и мягкие ткани лица&lt;/td&gt;
        &lt;td&gt;→ &lt;b&gt;Поднижнечелюстные&lt;/b&gt; узлы&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Нижняя губа и подбородок&lt;/td&gt;
        &lt;td&gt;→ &lt;b&gt;Подподбородочные&lt;/b&gt; узлы&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Язык&lt;/td&gt;
        &lt;td&gt;→ &lt;b&gt;Язычные&lt;/b&gt; узлы → поднижнечелюстные и подподбородочные → заглоточные и глубокие шейные&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Полость носа, полость рта, часть глотки, среднее ухо&lt;/td&gt;
        &lt;td&gt;→ &lt;b&gt;Заглоточные&lt;/b&gt; узлы → &lt;b&gt;глубокие шейные&lt;/b&gt; узлы&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Глазное яблоко&lt;/td&gt;
        &lt;td&gt;Лимфососудов &lt;u&gt;нет&lt;/u&gt; — есть лимфатические пространства (передняя и задняя камеры глаза, spatia zonularia), отток через венозную пазуху склеры&lt;/td&gt;
      &lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;

  &lt;div class=&quot;key-box&quot;&gt;
    &lt;strong&gt;⚡ Общее правило:&lt;/strong&gt; Все узлы головы в конечном итоге передают лимфу → &lt;b&gt;глубоким шейным узлам&lt;/b&gt; → яремные стволы → грудной / правый лимфатический проток.
  &lt;/div&gt;

&lt;!-- ==================== ЧАСТЬ 4 ==================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;part4&quot;&gt;
  &lt;h2&gt;4. Яремные стволы — конечный путь оттока&lt;/h2&gt;
  &lt;p&gt;От глубоких шейных узлов начинаются лимфатические сосуды, сопровождающие внутреннюю яремную вену с каждой стороны. Они образуют:&lt;/p&gt;

  &lt;div class=&quot;flow-list&quot;&gt;
    &lt;div class=&quot;flow-item&quot;&gt;
      &lt;span class=&quot;flow-arrow&quot;&gt;→&lt;/span&gt;
      &lt;span&gt;&lt;b&gt;Truncus jugularis sinister&lt;/b&gt; (левый яремный ствол) → впадает в &lt;b&gt;ductus thoracicus&lt;/b&gt; (грудной проток)&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;flow-item&quot;&gt;
      &lt;span class=&quot;flow-arrow&quot;&gt;→&lt;/span&gt;
      &lt;span&gt;&lt;b&gt;Truncus jugularis dexter&lt;/b&gt; (правый яремный ствол) → впадает в &lt;b&gt;ductus lymphaticus dexter&lt;/b&gt; (правый лимфатический проток)&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;mnemonic&quot;&gt;
    &lt;div class=&quot;label&quot;&gt;🧠 Мнемоника&lt;/div&gt;
    &lt;p&gt;&lt;b&gt;«Левый → в Ленту (грудной проток длинный, как лента)»&lt;/b&gt; — левый яремный ствол впадает в грудной проток.&lt;br&gt;
    &lt;b&gt;«Правый → Правый»&lt;/b&gt; — правый яремный ствол впадает в правый лимфатический проток.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ==================== ЧАСТЬ 5 ==================== --&gt;
&lt;div class=&quot;section accent-red&quot; id=&quot;part5&quot;&gt;
  &lt;h2&gt;5. Лимфоидное кольцо Вальдейера–Пирогова&lt;/h2&gt;

&lt;!-- ==================== ЧАСТЬ 6 ==================== --&gt;
&lt;div class=&quot;section accent-green&quot; id=&quot;part6&quot;&gt;
  &lt;h2&gt;6. Миндалины — подробный разбор&lt;/h2&gt;

  &lt;details&gt;
    &lt;summary&gt;🔵 Нёбная миндалина (tonsilla palatina) — парная, главная&lt;/summary&gt;
    &lt;div&gt;
      &lt;p&gt;&lt;b&gt;Расположение:&lt;/b&gt; в миндаликовой ямке (fossa tonsillaris) между нёбно-язычной и нёбно-глоточной дужками. Над миндалиной — надминдаликовая ямка (fossa supratonsillaris).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Строение:&lt;/b&gt; медиальная поверхность покрыта многослойным плоским эпителием, имеет до 20 ямочек (fossulae), в которые открываются крипты (cryptae tonsillares) с дихотомическими делениями до 3–4 порядка. Латерально — соединительнотканная капсула, от которой в медиальном направлении отходят трабекулы, разделяющие миндалину на дольки. В толще — лимфоидные узелки с центрами размножения.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Размеры:&lt;/b&gt; длина 13–28 мм, ширина 14–22 мм (максимальные в 8–30 лет).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Кровоснабжение:&lt;/b&gt; ветви a. pharyngea ascendens, a. facialis, a. palatina ascendens, a. palatina descendens (из a. maxillaris), a. lingualis.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Венозный отток:&lt;/b&gt; vv. tonsillares → вены крыловидного сплетения.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Лимфоотток:&lt;/b&gt; → латеральные глубокие шейные (внутренние яремные) лимфоузлы.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Иннервация:&lt;/b&gt; n. palatinus major (от ganglion pterygopalatinum), ramus tonsillaris n. glossopharyngei, симпатические волокна от plexus caroticus internus.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;

  &lt;details&gt;
    &lt;summary&gt;🟡 Глоточная миндалина (tonsilla pharyngealis / adenoidea) — непарная&lt;/summary&gt;
    &lt;div&gt;
      &lt;p&gt;&lt;b&gt;Расположение:&lt;/b&gt; свод и отчасти задняя стенка глотки, между правым и левым глоточными карманами (розенмюллеровыми ямками).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Строение:&lt;/b&gt; 4–6 поперечных и косых толстых складок слизистой с лимфоидной тканью внутри. Покрыта реснитчатым многорядным мерцательным эпителием. Содержит лимфоидные узелки до 0,8 мм с центрами размножения. Строма сращена с глоточно-базилярной фасцией.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Размеры:&lt;/b&gt; длина 13–21 мм, ширина 10–15 мм (максимум в 8–20 лет).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Клиника:&lt;/b&gt; при гипертрофии у детей — «аденоиды», могут закрывать хоаны и нарушать носовое дыхание.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;

  &lt;details&gt;
    &lt;summary&gt;🟠 Трубная миндалина (tonsilla tubaria) — парная&lt;/summary&gt;
    &lt;div&gt;
      &lt;p&gt;&lt;b&gt;Расположение:&lt;/b&gt; в области глоточного отверстия слуховой (Евстахиевой) трубы, в толще слизистой оболочки трубного валика.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Строение:&lt;/b&gt; прерывистая пластинка лимфоидной ткани; диффузная лимфоидная ткань и немногочисленные лимфоидные узелки. Покрыта реснитчатым мерцательным эпителием.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Развитие:&lt;/b&gt; закладывается на 7–8-м месяце жизни плода, наибольшего развития достигает в 4–7 лет. Инволюция — в подростковом и юношеском возрасте.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Кровоснабжение:&lt;/b&gt; ветви a. pharyngea ascendens (из a. carotis externa).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Венозный отток:&lt;/b&gt; вены глоточного сплетения.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Иннервация:&lt;/b&gt; ветви nn. facialis, glossopharyngeus, vagus + периартериальные симпатические сплетения.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;

  &lt;details&gt;
    &lt;summary&gt;🟢 Язычная миндалина (tonsilla lingualis) — непарная&lt;/summary&gt;
    &lt;div&gt;
      &lt;p&gt;&lt;b&gt;Расположение:&lt;/b&gt; корень языка, под многослойным эпителием. Часто имеет вид двух скоплений, разделённых срединной бороздой (и перегородкой языка в глубине).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Строение:&lt;/b&gt; бугристая поверхность (61–151 бугорков), между ними — крипты глубиной 2–4 мм. Содержит 80–90 лимфоидных узелков. Капсулы не имеет.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Размеры:&lt;/b&gt; 18–25 × 18–25 мм (максимум к 14–20 годам).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Кровоснабжение:&lt;/b&gt; ветви a. lingualis (правой и левой), иногда ветви a. facialis.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Венозный отток:&lt;/b&gt; v. lingualis.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Лимфоотток:&lt;/b&gt; → латеральные глубокие шейные (внутренние яремные) лимфоузлы.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Иннервация:&lt;/b&gt; nn. glossopharyngeus, vagus + симпатические волокна от plexus caroticus externus.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/details&gt;
&lt;/div&gt;

&lt;!-- ==================== ЧАСТЬ 7 ==================== --&gt;
&lt;div class=&quot;section&quot; id=&quot;part7&quot;&gt;
  &lt;h2&gt;7. Итоговая сводная схема: откуда и куда течёт лимфа&lt;/h2&gt;
  &lt;p&gt;Ниже — полная карта лимфооттока от основных образований головы и шеи для быстрого повторения:&lt;/p&gt;

  &lt;div class=&quot;diagram-wrap&quot;&gt;

    &lt;p&gt;&lt;b&gt;Шаг 1.&lt;/b&gt; Определи область → найди её региональные узлы (см. таблицу выше).&lt;br&gt;
    &lt;b&gt;Шаг 2.&lt;/b&gt; Все региональные узлы головы → выносящие сосуды → &lt;b&gt;глубокие шейные узлы&lt;/b&gt;.&lt;br&gt;
    &lt;b&gt;Шаг 3.&lt;/b&gt; Глубокие шейные → яремные стволы → грудной (слева) / правый лимфатический проток (справа).&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Лимфоотток от щитовидной железы (особый случай)&lt;/h3&gt;
  &lt;p&gt;Мелкие лимфатические сосуды лежат между фолликулами. Более крупные следуют вдоль артерий и несут лимфу в &lt;b&gt;глубокие шейные&lt;/b&gt;, &lt;b&gt;пред-&lt;/b&gt; и &lt;b&gt;паратрахеальные&lt;/b&gt; лимфоузлы. Далее лимфа оттекает в яремные стволы, которые впадают в грудной или правый лимфатический проток (в зависимости от стороны).&lt;/p&gt;

  &lt;h3&gt;Лимфоотток от шейного отдела пищевода&lt;/h3&gt;
  &lt;p&gt;Лимфатические сосуды шейного отдела пищевода отводят лимфу к &lt;b&gt;околотрахеальным&lt;/b&gt; и &lt;b&gt;глубоким шейным&lt;/b&gt; лимфоузлам.&lt;/p&gt;

  justify-content: center;
  text-align: center;
  padding: 60px 20px;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 60% at 50% 40%, rgba(232,93,93,0.12), transparent),
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(91,141,239,0.08), transparent),
    radial-gradient(ellipse 50% 40% at 20% 80%, rgba(78,205,196,0.06), transparent);
  z-index: 0;
}

.hero-content { position: relative; z-index: 1; max-width: 800px; }

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 5vw, 3.8rem);
  font-weight: 900;
  background: var(--gradient1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 12px;
  letter-spacing: -1px;
}

.hero .subtitle {
  font-size: 1.15rem;
  color: var(--text-dim);
  font-weight: 300;
}

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* NAV */
.toc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 32px;
  margin-bottom: 48px;
  position: relative;
  overflow: hidden;
}

.toc::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--gradient1);
}

.toc h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  margin-bottom: 16px;
  color: var(--accent);
}

.toc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 8px;
}

.toc a {
  color: var(--text);
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.95rem;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.toc a:hover {
  background: var(--surface2);
  color: var(--accent2);
}

.toc a .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--accent);
  width: 28px;
  flex-shrink: 0;
}

/* SECTIONS */
.section {
  margin-bottom: 56px;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--border);
}

.section-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--bg);
  background: var(--gradient1);
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.section-num.blue { background: var(--gradient2); }
.section-num.purple { background: var(--gradient3); }

.section h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  line-height: 1.3;
}

.section h2 .latin {
  display: block;
  font-size: 0.85rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  font-weight: 400;
  margin-top: 4px;
}

.section h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem;
  margin: 28px 0 14px;
  color: var(--accent2);
}

.section h4 {
  font-size: 1rem;
  font-weight: 600;
  margin: 18px 0 10px;
  color: var(--accent4);
}

p { margin-bottom: 14px; }

/* KEY POINT */
.key-point {
  background: var(--surface);
  border-left: 4px solid var(--accent);
  border-radius: 0 12px 12px 0;
  padding: 16px 20px;
  margin: 18px 0;
  font-size: 0.95rem;
}

.key-point.blue { border-left-color: var(--accent2); }
.key-point.green { border-left-color: var(--accent3); }
.key-point.yellow { border-left-color: var(--accent4); }
.key-point.purple { border-left-color: var(--accent5); }

.key-point strong { color: var(--accent); }
.key-point.blue strong { color: var(--accent2); }
.key-point.green strong { color: var(--accent3); }
.key-point.yellow strong { color: var(--accent4); }
.key-point.purple strong { color: var(--accent5); }

/* BRANCH LIST */
.branch-list {
  list-style: none;
  padding: 0;
  margin: 14px 0;
}

.branch-list li {
  padding: 8px 0 8px 28px;
  position: relative;
  border-left: 2px solid var(--border);
  margin-left: 12px;
  font-size: 0.95rem;
}

.branch-list li::before {
  content: '';
  position: absolute;
  left: -6px;
  top: 14px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
}

.branch-list li.blue::before { background: var(--accent2); }
.branch-list li.green::before { background: var(--accent3); }
.branch-list li.yellow::before { background: var(--accent4); }
.branch-list li.purple::before { background: var(--accent5); }

.branch-list .lat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  color: var(--accent3);
}

.branch-list .supply {
  color: var(--text-dim);
  font-size: 0.88rem;
}

/* CARDS */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin: 20px 0;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  transition: transform 0.2s, border-color 0.3s;
}

.card:hover {
  transform: translateY(-2px);
  border-color: var(--accent2);
}

.card h4 {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  margin: 0 0 8px;
  color: var(--accent2);
}

.card .lat-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--accent3);
  margin-bottom: 10px;
  display: block;
}

.card p {
  font-size: 0.9rem;
  color: var(--text-dim);
  margin: 0;
}

/* SCHEMA / SVG DIAGRAMS */
.diagram-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin: 24px 0;
  overflow-x: auto;
}

.diagram-wrap h4 {
  text-align: center;
  font-family: 'Playfair Display', serif;
  color: var(--accent4);
  margin: 0 0 16px;
  font-size: 1.1rem;
}

.diagram-wrap svg {
  display: block;
  margin: 0 auto;
  max-width: 100%;
  height: auto;
}

/* MNEMONIC */
.mnemonic {
  background: linear-gradient(135deg, rgba(165,105,247,0.1), rgba(91,141,239,0.1));
  border: 1px solid rgba(165,105,247,0.3);
  border-radius: 14px;
  padding: 20px 24px;
  margin: 20px 0;
  position: relative;
}

.mnemonic::before {
  content: '💡';
  font-size: 1.4rem;
  position: absolute;
  top: -12px;
  left: 20px;
  background: var(--bg);
  padding: 0 6px;
}

.mnemonic h4 {
  color: var(--accent5);
  margin: 4px 0 8px;
  font-size: 0.95rem;
}

.mnemonic p {
  font-size: 0.92rem;
  margin: 0;
}

/* ANASTOMOSIS TABLE */
.anast-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  margin: 20px 0;
  font-size: 0.9rem;
}

.anast-table th {
  background: var(--surface2);
  color: var(--accent2);
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  border-bottom: 2px solid var(--accent2);
}

.anast-table th:first-child { border-radius: 10px 0 0 0; }
.anast-table th:last-child { border-radius: 0 10px 0 0; }

.anast-table td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.anast-table tr:last-child td { border-bottom: none; }
.anast-table tr:hover td { background: var(--surface); }

/* RESPONSIVE */
@media (max-width: 640px) {
  .toc-grid { grid-template-columns: 1fr; }
  .card-grid { grid-template-columns: 1fr; }
  .section-header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .container { padding: 0 16px 60px; }
  .toc { padding: 20px; }
  .diagram-wrap { padding: 14px; }
  .anast-table { font-size: 0.8rem; }
  .anast-table td, .anast-table th { padding: 8px 10px; }
}
