&lt;!-- ========= SECTION 1 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;overview&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num&quot;&gt;01&lt;/div&gt;
    &lt;h2&gt;Общая схема кровоснабжения головы и шеи&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Органы и ткани головы и шеи получают кровь из &lt;strong&gt;трёх источников&lt;/strong&gt;, отходящих от дуги аорты:&lt;/p&gt;

  &lt;div class=&quot;diagram-wrap&quot;&gt;
    &lt;h4&gt;Схема: источники кровоснабжения головы и шеи&lt;/h4&gt;
    &lt;svg viewBox=&quot;0 0 800 340&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;
      &lt;defs&gt;
        &lt;marker id=&quot;arrowR&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; refX=&quot;8&quot; refY=&quot;4&quot; orient=&quot;auto&quot;&gt;
          &lt;path d=&quot;M0,0 L8,4 L0,8&quot; fill=&quot;#e85d5d&quot;/&gt;
        &lt;/marker&gt;
        &lt;marker id=&quot;arrowB&quot; markerWidth=&quot;8&quot; markerHeight=&quot;8&quot; refX=&quot;8&quot; refY=&quot;4&quot; orient=&quot;auto&quot;&gt;
          &lt;path d=&quot;M0,0 L8,4 L0,8&quot; fill=&quot;#5b8def&quot;/&gt;
        &lt;/marker&gt;
      &lt;/defs&gt;
      &lt;!-- Aorta arc --&gt;
      &lt;path d=&quot;M400,300 Q400,260 400,240&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;4&quot; fill=&quot;none&quot;/&gt;
      &lt;rect x=&quot;330&quot; y=&quot;296&quot; width=&quot;140&quot; height=&quot;36&quot; rx=&quot;8&quot; fill=&quot;#1e222d&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;319&quot; text-anchor=&quot;middle&quot; fill=&quot;#e85d5d&quot; font-family=&quot;'Playfair Display',serif&quot; font-size=&quot;15&quot; font-weight=&quot;700&quot;&gt;ДУГА АОРТЫ&lt;/text&gt;

      &lt;!-- 3 branches --&gt;
      &lt;!-- 1. Truncus brachiocephalicus --&gt;
      &lt;line x1=&quot;400&quot; y1=&quot;240&quot; x2=&quot;200&quot; y2=&quot;160&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#arrowR)&quot;/&gt;
      &lt;rect x=&quot;80&quot; y=&quot;130&quot; width=&quot;240&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#1e222d&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;200&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; fill=&quot;#e4e6ed&quot; font-family=&quot;'Source Sans 3',sans-serif&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;1. Плечеголовной ствол&lt;/text&gt;
      &lt;text x=&quot;200&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; fill=&quot;#4ecdc4&quot; font-family=&quot;'JetBrains Mono',monospace&quot; font-size=&quot;11&quot;&gt;truncus brachiocephalicus&lt;/text&gt;

      &lt;!-- 2. Left CCA --&gt;
      &lt;line x1=&quot;400&quot; y1=&quot;240&quot; x2=&quot;400&quot; y2=&quot;162&quot; stroke=&quot;#5b8def&quot; stroke-width=&quot;3&quot; marker-end=&quot;url(#arrowB)&quot;/&gt;
      &lt;rect x=&quot;300&quot; y=&quot;126&quot; width=&quot;200&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#1e222d&quot; stroke=&quot;#5b8def&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;148&quot; text-anchor=&quot;middle&quot; fill=&quot;#e4e6ed&quot; font-family=&quot;'Source Sans 3',sans-serif&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;2. Левая общая сонная&lt;/text&gt;
      &lt;text x=&quot;400&quot; y=&quot;168&quot; text-anchor=&quot;middle&quot; fill=&quot;#4ecdc4&quot; font-family=&quot;'JetBrains Mono',monospace&quot; font-size=&quot;11&quot;&gt;a. carotis communis sin.&lt;/text&gt;

      &lt;!-- 3. Left subclavia --&gt;
      &lt;line x1=&quot;400&quot; y1=&quot;240&quot; x2=&quot;600&quot; y2=&quot;160&quot; stroke=&quot;#a569f7&quot; stroke-width=&quot;3&quot;/&gt;
      &lt;circle cx=&quot;600&quot; cy=&quot;160&quot; r=&quot;4&quot; fill=&quot;#a569f7&quot;/&gt;
      &lt;rect x=&quot;510&quot; y=&quot;130&quot; width=&quot;220&quot; height=&quot;56&quot; rx=&quot;10&quot; fill=&quot;#1e222d&quot; stroke=&quot;#a569f7&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;620&quot; y=&quot;152&quot; text-anchor=&quot;middle&quot; fill=&quot;#e4e6ed&quot; font-family=&quot;'Source Sans 3',sans-serif&quot; font-size=&quot;14&quot; font-weight=&quot;600&quot;&gt;3. Левая подключичная&lt;/text&gt;
      &lt;text x=&quot;620&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; fill=&quot;#4ecdc4&quot; font-family=&quot;'JetBrains Mono',monospace&quot; font-size=&quot;11&quot;&gt;a. subclavia sinistra&lt;/text&gt;

      &lt;!-- Subdivisions of truncus --&gt;
      &lt;line x1=&quot;160&quot; y1=&quot;130&quot; x2=&quot;110&quot; y2=&quot;68&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5,3&quot;/&gt;
      &lt;circle cx=&quot;110&quot; cy=&quot;68&quot; r=&quot;3&quot; fill=&quot;#e85d5d&quot;/&gt;
      &lt;rect x=&quot;10&quot; y=&quot;38&quot; width=&quot;200&quot; height=&quot;48&quot; rx=&quot;8&quot; fill=&quot;#1e222d&quot; stroke=&quot;#f7b731&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;110&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; fill=&quot;#f7b731&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Правая общая сонная&lt;/text&gt;
      &lt;text x=&quot;110&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;a. carotis communis dex.&lt;/text&gt;

      &lt;line x1=&quot;240&quot; y1=&quot;130&quot; x2=&quot;290&quot; y2=&quot;68&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5,3&quot;/&gt;
      &lt;circle cx=&quot;290&quot; cy=&quot;68&quot; r=&quot;3&quot; fill=&quot;#e85d5d&quot;/&gt;
      &lt;rect x=&quot;220&quot; y=&quot;38&quot; width=&quot;180&quot; height=&quot;48&quot; rx=&quot;8&quot; fill=&quot;#1e222d&quot; stroke=&quot;#f7b731&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;text x=&quot;310&quot; y=&quot;57&quot; text-anchor=&quot;middle&quot; fill=&quot;#f7b731&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;Правая подключичная&lt;/text&gt;
      &lt;text x=&quot;310&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;a. subclavia dextra&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;key-point&quot;&gt;
    &lt;strong&gt;Запомни:&lt;/strong&gt; Плечеголовной ствол — только СПРАВА! Он делится на правую общую сонную и правую подключичную артерии. Слева обе артерии (общая сонная и подключичная) отходят самостоятельно от дуги аорты. Поэтому левая подключичная длиннее правой.
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ========= SECTION 2 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;aorta&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num blue&quot;&gt;02&lt;/div&gt;
    &lt;h2&gt;Дуга аорты и её ветви &lt;span class=&quot;latin&quot;&gt;Arcus aortae&lt;/span&gt;&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Дуга аорты начинается на 1–2 см ниже плечеголовного ствола, расположена позади рукоятки грудины. Обращена выпуклостью вверх и огибает левый бронх.&lt;/p&gt;

  &lt;p&gt;От &lt;strong&gt;выпуклой части&lt;/strong&gt; дуги аорты последовательно отходят три ветви (справа налево):&lt;/p&gt;
  &lt;ul class=&quot;branch-list&quot;&gt;
    &lt;li&gt;&lt;strong&gt;Плечеголовной ствол&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;truncus brachiocephalicus&lt;/span&gt; — длина ~4 см, делится на уровне правого грудино-ключичного сустава&lt;/li&gt;
    &lt;li class=&quot;blue&quot;&gt;&lt;strong&gt;Левая общая сонная артерия&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;a. carotis communis sinistra&lt;/span&gt;&lt;/li&gt;
    &lt;li class=&quot;purple&quot;&gt;&lt;strong&gt;Левая подключичная артерия&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;a. subclavia sinistra&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;

  &lt;div class=&quot;mnemonic&quot;&gt;
    &lt;h4&gt;Мнемоника: ПСП (→←)&lt;/h4&gt;
    &lt;p&gt;Ветви дуги аорты слева направо: &lt;strong&gt;П&lt;/strong&gt;лечеголовной ствол → &lt;strong&gt;С&lt;/strong&gt;онная (левая общая) → &lt;strong&gt;П&lt;/strong&gt;одключичная (левая). Запомни: «ПСП» — как пост скорой помощи.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ========= SECTION 3 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;carotis&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num&quot;&gt;03&lt;/div&gt;
    &lt;h2&gt;Общая сонная артерия &lt;span class=&quot;latin&quot;&gt;A. carotis communis&lt;/span&gt;&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Парная артерия. Правая берёт начало от плечеголовного ствола, левая — самостоятельно от дуги аорты. На шее прикрыта спереди грудино-ключично-сосцевидной мышцей, затем выходит в &lt;strong&gt;сонный треугольник&lt;/strong&gt;.&lt;/p&gt;

  &lt;div class=&quot;key-point blue&quot;&gt;
    &lt;strong&gt;Важно:&lt;/strong&gt; Общая сонная артерия по ходу ветвей НЕ ДАЁТ! На уровне верхнего края щитовидного хряща она делится на наружную и внутреннюю сонные артерии. Место деления — &lt;em&gt;бифуркация&lt;/em&gt;, где находится &lt;strong&gt;каротидный синус&lt;/strong&gt; (sinus caroticus) — рефлексогенная зона.
  &lt;/div&gt;

  &lt;div class=&quot;diagram-wrap&quot;&gt;
    &lt;h4&gt;Схема: бифуркация общей сонной артерии&lt;/h4&gt;

      &lt;defs&gt;

      &lt;text x=&quot;324&quot; y=&quot;188&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;(верхний край щитов. хряща)&lt;/text&gt;

      &lt;text x=&quot;155&quot; y=&quot;82&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;медиальнее, поверхностнее&lt;/text&gt;

      &lt;text x=&quot;445&quot; y=&quot;40&quot; text-anchor=&quot;middle&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Внутренняя сонная артерия&lt;/text&gt;
      &lt;text x=&quot;445&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;10&quot; font-family=&quot;monospace&quot;&gt;a. carotis interna&lt;/text&gt;
      &lt;text x=&quot;400&quot; y=&quot;82&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;латеральнее, глубже&lt;/text&gt;
    &lt;/svg&gt;

  &lt;div class=&quot;mnemonic&quot;&gt;
    &lt;h4&gt;Как отличить наружную от внутренней?&lt;/h4&gt;
    &lt;p&gt;&lt;strong&gt;Наружная&lt;/strong&gt; сонная — поверхностнее и медиальнее, даёт ветви на шее. &lt;strong&gt;Внутренняя&lt;/strong&gt; — глубже и латеральнее, на шее ветвей НЕ ДАЁТ (все её ветви — внутри черепа и в сонном канале).&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ========= SECTION 4 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;ext-carotis&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num&quot;&gt;04&lt;/div&gt;
    &lt;h2&gt;Наружная сонная артерия &lt;span class=&quot;latin&quot;&gt;A. carotis externa&lt;/span&gt;&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Идёт вверх до височно-нижнечелюстного сустава, где делится на конечные ветви. Все ветви делятся на &lt;strong&gt;3 группы&lt;/strong&gt; по направлению:&lt;/p&gt;

      &lt;text x=&quot;125&quot; y=&quot;160&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;11&quot;&gt;9. Поверхн. височная&lt;/text&gt;
      &lt;line x1=&quot;410&quot; y1=&quot;80&quot; x2=&quot;220&quot; y2=&quot;155&quot; stroke=&quot;#f7b731&quot; stroke-width=&quot;2&quot;/&gt;

  &lt;div class=&quot;mnemonic&quot;&gt;
    &lt;h4&gt;Мнемоника: «ЯЛЩ — ЗЗГ — ВГ + конечные ВП»&lt;/h4&gt;
    &lt;p&gt;Передние: &lt;strong&gt;Я&lt;/strong&gt;зычная, &lt;strong&gt;Л&lt;/strong&gt;ицевая, &lt;strong&gt;Щ&lt;/strong&gt;итовидная (верхняя). Задние: &lt;strong&gt;З&lt;/strong&gt;атылочная, &lt;strong&gt;З&lt;/strong&gt;адняя ушная, &lt;strong&gt;Г&lt;/strong&gt;рудино-ключично-сосцевидная. Медиальная: &lt;strong&gt;В&lt;/strong&gt;осходящая &lt;strong&gt;Г&lt;/strong&gt;лоточная. Конечные: &lt;strong&gt;В&lt;/strong&gt;ерхнечелюстная, &lt;strong&gt;П&lt;/strong&gt;оверхностная височная.&lt;/p&gt;
  &lt;/div&gt;

  &lt;h3&gt;Подробнее о передних ветвях&lt;/h3&gt;

  &lt;div class=&quot;card-grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;1. Верхняя щитовидная&lt;/h4&gt;
      &lt;span class=&quot;lat-name&quot;&gt;a. thyreoidea superior&lt;/span&gt;
      &lt;p&gt;Отходит на уровне верхнего края щитовидного хряща. Идёт к верхнему полюсу щитовидной железы. Отдаёт &lt;strong&gt;верхнюю гортанную артерию&lt;/strong&gt; (a. laryngea superior) → слизистая и мышцы гортани.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;2. Язычная&lt;/h4&gt;
      &lt;span class=&quot;lat-name&quot;&gt;a. lingualis&lt;/span&gt;
      &lt;p&gt;Проходит в треугольнике Пирогова к корню языка. Ветви: тыльные ветви языка, подъязычная артерия (a. sublingualis), &lt;strong&gt;глубокая артерия языка&lt;/strong&gt; (a. profunda linguae) — до кончика.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;3. Лицевая&lt;/h4&gt;
      &lt;span class=&quot;lat-name&quot;&gt;a. facialis&lt;/span&gt;
      &lt;p&gt;Огибает нижнюю челюсть → к углу рта → медиальный угол глаза. Конечная ветвь — &lt;strong&gt;угловая артерия&lt;/strong&gt; (a. angularis), анастомозирует с a. dorsalis nasi (из внутренней сонной).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h4&gt;Ветви лицевой артерии:&lt;/h4&gt;
  &lt;ul class=&quot;branch-list&quot;&gt;
    &lt;li&gt;Восходящая нёбная артерия &lt;span class=&quot;lat&quot;&gt;a. palatina ascendens&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ мягкое нёбо, миндалины&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Ветвь к миндалине &lt;span class=&quot;lat&quot;&gt;r. tonsillaris&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Подподбородочная артерия &lt;span class=&quot;lat&quot;&gt;a. submentalis&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Нижняя и верхняя губные артерии &lt;span class=&quot;lat&quot;&gt;a. labialis inferior et superior&lt;/span&gt;&lt;/li&gt;
    &lt;li class=&quot;yellow&quot;&gt;&lt;strong&gt;Угловая артерия&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;a. angularis&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ конечная ветвь, анастомоз!&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;Подробнее о задних ветвях&lt;/h3&gt;

  &lt;div class=&quot;card-grid&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;4. Затылочная&lt;/h4&gt;
      &lt;span class=&quot;lat-name&quot;&gt;a. occipitalis&lt;/span&gt;
      &lt;p&gt;Направляется назад и вверх. Кровоснабжает кожу и мышцы затылка, ушную раковину, через мыщелковый канал → ТМО задней черепной ямки.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;5. Задняя ушная&lt;/h4&gt;
      &lt;span class=&quot;lat-name&quot;&gt;a. auricularis posterior&lt;/span&gt;
      &lt;p&gt;Между наружным слуховым проходом и сосцевидным отростком. Кровоснабжает ушную раковину, околоушную железу, барабанную полость (через шилососцевидное отверстие).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Медиальная ветвь&lt;/h3&gt;
  &lt;div class=&quot;key-point green&quot;&gt;
    &lt;strong&gt;Восходящая глоточная артерия&lt;/strong&gt; (a. pharyngea ascendens) — самая глубокая ветвь. Идёт между наружной и внутренней сонными артериями. Питает: глотку, мягкое нёбо, ТМО задней черепной ямки (через яремное отверстие), барабанную полость (a. tympanica inferior).
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ========= SECTION 5 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;maxillaris&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num blue&quot;&gt;05&lt;/div&gt;
    &lt;h2&gt;Верхнечелюстная артерия &lt;span class=&quot;latin&quot;&gt;A. maxillaris&lt;/span&gt;&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Конечная ветвь наружной сонной артерии. Огибает шейку нижней челюсти → подвисочная ямка → крылонёбная ямка. Топографически делится на &lt;strong&gt;3 части&lt;/strong&gt;:&lt;/p&gt;

  &lt;div class=&quot;diagram-wrap&quot;&gt;
    &lt;h4&gt;Схема: три отдела верхнечелюстной артерии&lt;/h4&gt;
    &lt;svg viewBox=&quot;0 0 800 300&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;
      &lt;!-- Main artery line --&gt;
      &lt;path d=&quot;M60,180 Q200,180 350,140 Q500,100 740,80&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;4&quot; fill=&quot;none&quot;/&gt;

      &lt;!-- Part 1 --&gt;
      &lt;rect x=&quot;30&quot; y=&quot;210&quot; width=&quot;220&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;#1e222d&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;140&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; fill=&quot;#e85d5d&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;1. Нижнечелюстная часть&lt;/text&gt;
      &lt;text x=&quot;140&quot; y=&quot;248&quot; text-anchor=&quot;middle&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;10&quot;&gt;pars mandibularis&lt;/text&gt;
      &lt;text x=&quot;140&quot; y=&quot;268&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;• A. meningea media (ТМО!)&lt;/text&gt;
      &lt;text x=&quot;140&quot; y=&quot;280&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;• A. alveolaris inf. • A. auric. prof.&lt;/text&gt;
      &lt;line x1=&quot;140&quot; y1=&quot;210&quot; x2=&quot;120&quot; y2=&quot;185&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3,3&quot;/&gt;

      &lt;!-- Part 2 --&gt;
      &lt;rect x=&quot;290&quot; y=&quot;150&quot; width=&quot;220&quot; height=&quot;70&quot; rx=&quot;10&quot; fill=&quot;#1e222d&quot; stroke=&quot;#5b8def&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;172&quot; text-anchor=&quot;middle&quot; fill=&quot;#5b8def&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;2. Крыловидная часть&lt;/text&gt;
      &lt;text x=&quot;400&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;10&quot;&gt;pars pterygoidea&lt;/text&gt;
      &lt;text x=&quot;400&quot; y=&quot;208&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;Мышечные ветви (жеват. мм.)&lt;/text&gt;
      &lt;line x1=&quot;370&quot; y1=&quot;150&quot; x2=&quot;350&quot; y2=&quot;138&quot; stroke=&quot;#5b8def&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3,3&quot;/&gt;

      &lt;!-- Part 3 --&gt;
      &lt;rect x=&quot;550&quot; y=&quot;10&quot; width=&quot;230&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;#1e222d&quot; stroke=&quot;#a569f7&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;text x=&quot;665&quot; y=&quot;32&quot; text-anchor=&quot;middle&quot; fill=&quot;#a569f7&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot;&gt;3. Крылонёбная часть&lt;/text&gt;
      &lt;text x=&quot;665&quot; y=&quot;48&quot; text-anchor=&quot;middle&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;10&quot;&gt;pars pterygopalatina&lt;/text&gt;
      &lt;text x=&quot;665&quot; y=&quot;65&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;• A. infraorbitalis (подглазничная)&lt;/text&gt;
      &lt;text x=&quot;665&quot; y=&quot;78&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;• A. palatina desc. • A. sphenopalat.&lt;/text&gt;
      &lt;line x1=&quot;665&quot; y1=&quot;90&quot; x2=&quot;680&quot; y2=&quot;82&quot; stroke=&quot;#a569f7&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;3,3&quot;/&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div class=&quot;key-point purple&quot;&gt;
    &lt;strong&gt;Средняя артерия твёрдой мозговой оболочки&lt;/strong&gt; (a. meningea media) — клинически самая важная ветвь! Входит в череп через &lt;em&gt;остистое отверстие&lt;/em&gt; (foramen spinosum). При травме височной области повреждение этой артерии → эпидуральная гематома.
  &lt;/div&gt;

  &lt;h4&gt;Ветви крылонёбной части (конечные):&lt;/h4&gt;
  &lt;ul class=&quot;branch-list&quot;&gt;
    &lt;li class=&quot;yellow&quot;&gt;&lt;strong&gt;Подглазничная артерия&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;a. infraorbitalis&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ зубы верхней челюсти, подглазничная область&lt;/span&gt;&lt;/li&gt;
    &lt;li class=&quot;purple&quot;&gt;&lt;strong&gt;Нисходящая нёбная&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;a. palatina descendens&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ твёрдое и мягкое нёбо&lt;/span&gt;&lt;/li&gt;
    &lt;li class=&quot;green&quot;&gt;&lt;strong&gt;Клиновидно-нёбная&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;a. sphenopalatina&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ полость носа (конечная ветвь!)&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;

&lt;!-- ========= SECTION 6 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;int-carotis&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num purple&quot;&gt;06&lt;/div&gt;
    &lt;h2&gt;Внутренняя сонная артерия &lt;span class=&quot;latin&quot;&gt;A. carotis interna&lt;/span&gt;&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Располагается позади и латеральнее наружной сонной артерии. Входит в сонный канал (canalis caroticus) → через рваное отверстие (foramen lacerum) → в полость черепа.&lt;/p&gt;

  &lt;div class=&quot;key-point&quot;&gt;
    &lt;strong&gt;На шее ветвей не даёт!&lt;/strong&gt; Только в сонном канале отходят мелкие сонно-барабанные артерии (rr. caroticotympanicae) к слизистой барабанной полости. Все основные ветви — внутри черепа.
  &lt;/div&gt;

  &lt;h3&gt;Ветви внутренней сонной артерии (в полости черепа):&lt;/h3&gt;

  &lt;div class=&quot;diagram-wrap&quot;&gt;
    &lt;h4&gt;Схема: ветви внутренней сонной артерии&lt;/h4&gt;
    &lt;svg viewBox=&quot;0 0 760 380&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;
      &lt;!-- Trunk --&gt;
      &lt;line x1=&quot;380&quot; y1=&quot;370&quot; x2=&quot;380&quot; y2=&quot;180&quot; stroke=&quot;#5b8def&quot; stroke-width=&quot;4&quot;/&gt;
      &lt;text x=&quot;390&quot; y=&quot;365&quot; fill=&quot;#5b8def&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;A. carotis interna&lt;/text&gt;

      &lt;!-- 1. Ophthalmic --&gt;
      &lt;line x1=&quot;380&quot; y1=&quot;260&quot; x2=&quot;180&quot; y2=&quot;220&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;circle cx=&quot;180&quot; cy=&quot;220&quot; r=&quot;5&quot; fill=&quot;#e85d5d&quot;/&gt;
      &lt;text x=&quot;30&quot; y=&quot;216&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;1. Глазная артерия&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;232&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;10&quot;&gt;a. ophthalmica&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;246&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;→ глазница, решётчатая кость&lt;/text&gt;

      &lt;!-- 2. Anterior cerebral --&gt;
      &lt;line x1=&quot;380&quot; y1=&quot;190&quot; x2=&quot;220&quot; y2=&quot;90&quot; stroke=&quot;#4ecdc4&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;circle cx=&quot;220&quot; cy=&quot;90&quot; r=&quot;5&quot; fill=&quot;#4ecdc4&quot;/&gt;
      &lt;text x=&quot;30&quot; y=&quot;86&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;2. Передняя мозговая&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;102&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;10&quot;&gt;a. cerebri anterior&lt;/text&gt;
      &lt;text x=&quot;30&quot; y=&quot;116&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;→ мед. поверхн. полушарий&lt;/text&gt;

      &lt;!-- 3. Middle cerebral --&gt;
      &lt;line x1=&quot;380&quot; y1=&quot;190&quot; x2=&quot;580&quot; y2=&quot;80&quot; stroke=&quot;#f7b731&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;circle cx=&quot;580&quot; cy=&quot;80&quot; r=&quot;5&quot; fill=&quot;#f7b731&quot;/&gt;
      &lt;text x=&quot;600&quot; y=&quot;76&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;3. Средняя мозговая&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;92&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;10&quot;&gt;a. cerebri media&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;106&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;→ САМАЯ КРУПНАЯ!&lt;/text&gt;
      &lt;text x=&quot;600&quot; y=&quot;120&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;верхнебоковая поверхн.&lt;/text&gt;

      &lt;text x=&quot;575&quot; y=&quot;266&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot;&gt;5. Ворсинчатая&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;282&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;10&quot;&gt;a. choroidea&lt;/text&gt;
      &lt;text x=&quot;575&quot; y=&quot;296&quot; fill=&quot;#8b90a0&quot; font-size=&quot;10&quot;&gt;→ сосуд. сплетения желуд.&lt;/text&gt;

  &lt;/div&gt;

  &lt;h4&gt;Ветви глазной артерии (a. ophthalmica) — для запоминания:&lt;/h4&gt;
  &lt;ul class=&quot;branch-list&quot;&gt;
    &lt;li&gt;Слёзная артерия &lt;span class=&quot;lat&quot;&gt;a. lacrimalis&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Ресничные артерии &lt;span class=&quot;lat&quot;&gt;aa. ciliares&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ сосудистая оболочка глаза&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Центральная артерия сетчатки &lt;span class=&quot;lat&quot;&gt;a. centralis retinae&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Передняя и задняя решётчатые &lt;span class=&quot;lat&quot;&gt;aa. ethmoidales ant. et post.&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ полость носа!&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Надглазничная &lt;span class=&quot;lat&quot;&gt;a. supraorbitalis&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ кожа лба&lt;/span&gt;&lt;/li&gt;
    &lt;li class=&quot;yellow&quot;&gt;&lt;strong&gt;Дорсальная артерия носа&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;a. dorsalis nasi&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ анастомоз с a. angularis (из лицевой)!&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;

&lt;!-- ========= SECTION 7 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;subclavia&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num&quot;&gt;07&lt;/div&gt;
    &lt;h2&gt;Подключичная артерия &lt;span class=&quot;latin&quot;&gt;A. subclavia&lt;/span&gt;&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Правая — от плечеголовного ствола, левая — от дуги аорты (длиннее!). Огибает верхушку лёгкого, проходит между передней и средней лестничными мышцами → под ключицу → переходит в подмышечную артерию (a. axillaris).&lt;/p&gt;

  &lt;p&gt;Топографически делится на &lt;strong&gt;3 отдела&lt;/strong&gt;:&lt;/p&gt;

  &lt;div class=&quot;diagram-wrap&quot;&gt;
    &lt;h4&gt;Схема: отделы и ветви подключичной артерии&lt;/h4&gt;
    &lt;svg viewBox=&quot;0 0 800 430&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;

      &lt;line x1=&quot;280&quot; y1=&quot;190&quot; x2=&quot;280&quot; y2=&quot;250&quot; stroke=&quot;#f7b731&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4,3&quot;/&gt;
      &lt;line x1=&quot;520&quot; y1=&quot;190&quot; x2=&quot;520&quot; y2=&quot;250&quot; stroke=&quot;#f7b731&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;4,3&quot;/&gt;

      &lt;!-- Section labels --&gt;
      &lt;rect x=&quot;80&quot; y=&quot;255&quot; width=&quot;180&quot; height=&quot;28&quot; rx=&quot;6&quot; fill=&quot;rgba(232,93,93,0.15)&quot;/&gt;
      &lt;text x=&quot;170&quot; y=&quot;274&quot; text-anchor=&quot;middle&quot; fill=&quot;#e85d5d&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;I отдел (до лестничных мм.)&lt;/text&gt;

      &lt;rect x=&quot;310&quot; y=&quot;255&quot; width=&quot;180&quot; height=&quot;28&quot; rx=&quot;6&quot; fill=&quot;rgba(91,141,239,0.15)&quot;/&gt;
      &lt;text x=&quot;400&quot; y=&quot;274&quot; text-anchor=&quot;middle&quot; fill=&quot;#5b8def&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;II отдел (межлестничный)&lt;/text&gt;

      &lt;rect x=&quot;550&quot; y=&quot;255&quot; width=&quot;180&quot; height=&quot;28&quot; rx=&quot;6&quot; fill=&quot;rgba(165,105,247,0.15)&quot;/&gt;
      &lt;text x=&quot;640&quot; y=&quot;274&quot; text-anchor=&quot;middle&quot; fill=&quot;#a569f7&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;III отдел (после)&lt;/text&gt;

      &lt;!-- I отдел branches --&gt;
      &lt;line x1=&quot;100&quot; y1=&quot;220&quot; x2=&quot;80&quot; y2=&quot;100&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;circle cx=&quot;80&quot; cy=&quot;100&quot; r=&quot;4&quot; fill=&quot;#e85d5d&quot;/&gt;
      &lt;text x=&quot;10&quot; y=&quot;80&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot;&gt;3.1. Позвоночная&lt;/text&gt;
      &lt;text x=&quot;10&quot; y=&quot;94&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;9&quot;&gt;a. vertebralis&lt;/text&gt;

      &lt;line x1=&quot;170&quot; y1=&quot;220&quot; x2=&quot;170&quot; y2=&quot;120&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;circle cx=&quot;170&quot; cy=&quot;120&quot; r=&quot;4&quot; fill=&quot;#e85d5d&quot;/&gt;
      &lt;text x=&quot;115&quot; y=&quot;110&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot;&gt;3.2. Внутр. грудная&lt;/text&gt;
      &lt;text x=&quot;115&quot; y=&quot;124&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;9&quot;&gt;a. thoracica int.&lt;/text&gt;

      &lt;line x1=&quot;240&quot; y1=&quot;220&quot; x2=&quot;260&quot; y2=&quot;130&quot; stroke=&quot;#e85d5d&quot; stroke-width=&quot;2&quot;/&gt;

      &lt;text x=&quot;200&quot; y=&quot;145&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot;&gt;3.3. Щито-шейный ствол&lt;/text&gt;

      &lt;line x1=&quot;400&quot; y1=&quot;220&quot; x2=&quot;400&quot; y2=&quot;130&quot; stroke=&quot;#5b8def&quot; stroke-width=&quot;2&quot;/&gt;

      &lt;text x=&quot;340&quot; y=&quot;134&quot; fill=&quot;#4ecdc4&quot; font-size=&quot;9&quot;&gt;truncus costocervicalis&lt;/text&gt;

      &lt;!-- III отдел --&gt;
      &lt;line x1=&quot;640&quot; y1=&quot;220&quot; x2=&quot;640&quot; y2=&quot;130&quot; stroke=&quot;#a569f7&quot; stroke-width=&quot;2&quot;/&gt;
      &lt;circle cx=&quot;640&quot; cy=&quot;130&quot; r=&quot;4&quot; fill=&quot;#a569f7&quot;/&gt;
      &lt;text x=&quot;570&quot; y=&quot;120&quot; fill=&quot;#e4e6ed&quot; font-size=&quot;11&quot; font-weight=&quot;600&quot;&gt;3.5. Поперечная а. шеи&lt;/text&gt;

      &lt;text x=&quot;50&quot; y=&quot;50&quot; fill=&quot;#f7b731&quot; font-size=&quot;10&quot;&gt;• Восходящая шейная (a. cervicalis asc.)&lt;/text&gt;

      &lt;text x=&quot;310&quot; y=&quot;50&quot; fill=&quot;#5b8def&quot; font-size=&quot;10&quot;&gt;• Наивысшая межрёб. (a. intercost. supr.)&lt;/text&gt;

      &lt;text x=&quot;400&quot; y=&quot;336&quot; text-anchor=&quot;middle&quot; fill=&quot;#8b90a0&quot; font-size=&quot;11&quot;&gt;II отдел: Рёберно-шейный ствол • III отдел: Поперечная артерия шеи&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;h3&gt;Позвоночная артерия (a. vertebralis) — подробно&lt;/h3&gt;

  &lt;p&gt;Отходит от первого отдела подключичной артерии, проходит через поперечные отверстия &lt;strong&gt;VI–I шейных позвонков&lt;/strong&gt; → по борозде атланта → через большое затылочное отверстие → в полость черепа. У заднего края моста обе позвоночные артерии сливаются в &lt;strong&gt;базилярную артерию&lt;/strong&gt; (a. basilaris).&lt;/p&gt;

  &lt;h4&gt;Ветви позвоночной артерии:&lt;/h4&gt;
  &lt;ul class=&quot;branch-list&quot;&gt;
    &lt;li&gt;Спинномозговые ветви &lt;span class=&quot;lat&quot;&gt;rr. spinales&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ спинной мозг, оболочки&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Мышечные ветви &lt;span class=&quot;lat&quot;&gt;rr. musculares&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ глубокие мышцы шеи&lt;/span&gt;&lt;/li&gt;
    &lt;li class=&quot;blue&quot;&gt;Задняя нижняя мозжечковая &lt;span class=&quot;lat&quot;&gt;a. cerebelli inferior posterior&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Передняя спинномозговая &lt;span class=&quot;lat&quot;&gt;a. spinalis anterior&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;(формирует артериальный круг Захарченко)&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Задняя спинномозговая &lt;span class=&quot;lat&quot;&gt;a. spinalis posterior&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;Базилярная артерия (a. basilaris)&lt;/h3&gt;
  &lt;p&gt;Непарный сосуд, образуется слиянием правой и левой позвоночных артерий. Располагается в базилярной борозде моста. На уровне переднего края моста делится на &lt;strong&gt;задние мозговые артерии&lt;/strong&gt; (aa. cerebri posteriores).&lt;/p&gt;

  &lt;h4&gt;Ветви базилярной артерии:&lt;/h4&gt;
  &lt;ul class=&quot;branch-list&quot;&gt;
    &lt;li class=&quot;blue&quot;&gt;Передние нижние мозжечковые &lt;span class=&quot;lat&quot;&gt;aa. cerebelli inferiores anteriores&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;(+ a. labyrinthi → внутреннее ухо!)&lt;/span&gt;&lt;/li&gt;
    &lt;li class=&quot;blue&quot;&gt;Верхние мозжечковые &lt;span class=&quot;lat&quot;&gt;aa. cerebelli superiores&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Артерии моста &lt;span class=&quot;lat&quot;&gt;aa. pontis&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Среднемозговые &lt;span class=&quot;lat&quot;&gt;aa. mesencephalici&lt;/span&gt;&lt;/li&gt;
    &lt;li class=&quot;yellow&quot;&gt;&lt;strong&gt;Задние мозговые артерии&lt;/strong&gt; &lt;span class=&quot;lat&quot;&gt;aa. cerebri posteriores&lt;/span&gt; &lt;span class=&quot;supply&quot;&gt;→ конечные ветви! → Виллизиев круг&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;

&lt;!-- ========= SECTION 8 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;willis&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num blue&quot;&gt;08&lt;/div&gt;
    &lt;h2&gt;Артериальный (Виллизиев) круг большого мозга &lt;span class=&quot;latin&quot;&gt;Circulus arteriosus cerebri&lt;/span&gt;&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Расположен на основании мозга в подпаутинном пространстве. Охватывает зрительный перекрёст и гипоталамус. Обеспечивает коллатеральное кровоснабжение мозга при нарушении проходимости одной из артерий.&lt;/p&gt;

      &lt;text x=&quot;45&quot; y=&quot;436&quot; fill=&quot;#e85d5d&quot; font-size=&quot;10&quot; font-weight=&quot;600&quot;&gt;● Задняя часть (из a. basilaris)&lt;/text&gt;

  &lt;div class=&quot;key-point green&quot;&gt;
    &lt;strong&gt;Состав Виллизиева круга:&lt;/strong&gt; Спереди — передняя соединительная артерия между правой и левой передними мозговыми. По бокам — внутренние сонные → задние соединительные артерии. Сзади — задние мозговые артерии (от базилярной). Таким образом, круг соединяет систему внутренней сонной и вертебро-базилярную систему.
  &lt;/div&gt;

  &lt;div class=&quot;mnemonic&quot;&gt;
    &lt;h4&gt;Формула Виллизиева круга&lt;/h4&gt;
    &lt;p&gt;&lt;strong&gt;Спереди:&lt;/strong&gt; ACA (L) ← a. communicans anterior → ACA (R)&lt;br&gt;
    &lt;strong&gt;Боковые:&lt;/strong&gt; ICA → a. communicans posterior&lt;br&gt;
    &lt;strong&gt;Сзади:&lt;/strong&gt; PCA (L) ← a. basilaris → PCA (R)&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ========= SECTION 9 ========= --&gt;
&lt;div class=&quot;section&quot; id=&quot;anastomoses&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num purple&quot;&gt;09&lt;/div&gt;
    &lt;h2&gt;Анастомозы артерий головы и шеи&lt;/h2&gt;
  &lt;/div&gt;

  &lt;p&gt;Анастомозы — это соединения между ветвями различных артерий, обеспечивающие коллатеральное (обходное) кровоснабжение. Клинически крайне важны!&lt;/p&gt;

  &lt;table class=&quot;anast-table&quot;&gt;
    &lt;thead&gt;
      &lt;tr&gt;
        &lt;th&gt;Место&lt;/th&gt;
        &lt;th&gt;Артерия 1&lt;/th&gt;
        &lt;th&gt;Артерия 2&lt;/th&gt;
        &lt;th&gt;Системы&lt;/th&gt;
      &lt;/tr&gt;
    &lt;/thead&gt;
    &lt;tbody&gt;
      &lt;tr&gt;
        &lt;td&gt;Медиальный угол глаза&lt;/td&gt;
        &lt;td&gt;A. dorsalis nasi (от глазной)&lt;/td&gt;
        &lt;td&gt;A. angularis (от лицевой)&lt;/td&gt;
        &lt;td style=&quot;color:#f7b731&quot;&gt;Внутр. сонная ↔ Наружн. сонная&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Область лба&lt;/td&gt;
        &lt;td&gt;A. supraorbitalis (от глазной)&lt;/td&gt;
        &lt;td&gt;R. frontalis (от поверхн. височной)&lt;/td&gt;
        &lt;td style=&quot;color:#f7b731&quot;&gt;Внутр. сонная ↔ Наружн. сонная&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Основание мозга&lt;/td&gt;
        &lt;td&gt;A. communicans posterior (от внутр. сонной)&lt;/td&gt;
        &lt;td&gt;A. cerebri posterior (от базилярной)&lt;/td&gt;
        &lt;td style=&quot;color:#4ecdc4&quot;&gt;Внутр. сонная ↔ Подключичная&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Щитовидная железа&lt;/td&gt;
        &lt;td&gt;A. thyreoidea superior (от наружн. сонной)&lt;/td&gt;
        &lt;td&gt;A. thyreoidea inferior (от подключичной)&lt;/td&gt;
        &lt;td style=&quot;color:#a569f7&quot;&gt;Наружн. сонная ↔ Подключичная&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Полость носа&lt;/td&gt;
        &lt;td&gt;A. sphenopalatina (от верхнечелюстной)&lt;/td&gt;
        &lt;td&gt;Aa. ethmoidales (от глазной)&lt;/td&gt;
        &lt;td style=&quot;color:#f7b731&quot;&gt;Наружн. сонная ↔ Внутр. сонная&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td&gt;Барабанная полость&lt;/td&gt;
        &lt;td&gt;Rr. caroticotympanicae (от внутр. сонной)&lt;/td&gt;
        &lt;td&gt;Rr. tympanicae (от наружн. сонной)&lt;/td&gt;
        &lt;td style=&quot;color:#f7b731&quot;&gt;Внутр. сонная ↔ Наружн. сонная&lt;/td&gt;
      &lt;/tr&gt;
    &lt;/tbody&gt;
  &lt;/table&gt;

  &lt;div class=&quot;mnemonic&quot;&gt;
    &lt;h4&gt;Два главных анастомоза для экзамена&lt;/h4&gt;
    &lt;p&gt;&lt;strong&gt;1. Угол глаза:&lt;/strong&gt; a. dorsalis nasi (внутренняя сонная → глазная) ↔ a. angularis (наружная сонная → лицевая). &lt;strong&gt;2. Виллизиев круг:&lt;/strong&gt; a. communicans posterior соединяет внутреннюю сонную с вертебро-базилярной системой.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;key-point yellow&quot;&gt;
    &lt;strong&gt;Клиническое значение:&lt;/strong&gt; Анастомозы обеспечивают коллатеральное кровообращение при закупорке или перевязке одной из артерий. Например, при перевязке наружной сонной артерии кровоснабжение лица сохраняется через анастомоз a. dorsalis nasi ↔ a. angularis.
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- FINAL SUMMARY --&gt;
&lt;div class=&quot;section&quot;&gt;
  &lt;div class=&quot;section-header&quot;&gt;
    &lt;div class=&quot;section-num&quot; style=&quot;background: linear-gradient(135deg, #f7b731, #e85d5d);&quot;&gt;✓&lt;/div&gt;
    &lt;h2&gt;Краткая итоговая таблица&lt;/h2&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card-grid&quot;&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color: #e85d5d;&quot;&gt;
      &lt;h4 style=&quot;color: #e85d5d;&quot;&gt;Наружная сонная (9 ветвей)&lt;/h4&gt;
      &lt;p&gt;&lt;strong&gt;Передние:&lt;/strong&gt; верхняя щитовидная, язычная, лицевая&lt;br&gt;
      &lt;strong&gt;Задние:&lt;/strong&gt; грудино-кл.-сосц., затылочная, задняя ушная&lt;br&gt;
      &lt;strong&gt;Медиальная:&lt;/strong&gt; восходящая глоточная&lt;br&gt;
      &lt;strong&gt;Конечные:&lt;/strong&gt; верхнечелюстная, поверхностная височная&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color: #5b8def;&quot;&gt;
      &lt;h4 style=&quot;color: #5b8def;&quot;&gt;Внутренняя сонная (5 ветвей в черепе)&lt;/h4&gt;
      &lt;p&gt;Глазная → передняя мозговая → средняя мозговая (самая крупная!) → задняя соединительная → ворсинчатая&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;border-color: #a569f7;&quot;&gt;
      &lt;h4 style=&quot;color: #a569f7;&quot;&gt;Подключичная (5 ветвей)&lt;/h4&gt;
      &lt;p&gt;&lt;strong&gt;I отдел:&lt;/strong&gt; позвоночная, внутренняя грудная, щито-шейный ствол&lt;br&gt;
      &lt;strong&gt;II отдел:&lt;/strong&gt; рёберно-шейный ствол&lt;br&gt;
      &lt;strong&gt;III отдел:&lt;/strong&gt; поперечная артерия шеи&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;vheader&quot;&gt;
  &lt;div class=&quot;sub&quot;&gt;Конспект по анатомии&lt;/div&gt;
  &lt;h1&gt;Вены головы и шеи&lt;/h1&gt;
  &lt;div class=&quot;desc&quot;&gt;Венозный отток от образований головы и шеи&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vcontrols&quot;&gt;
  &lt;button onclick=&quot;document.querySelectorAll('.vsection').forEach(s=&gt;s.classList.add('open'))&quot;&gt;Раскрыть всё&lt;/button&gt;
  &lt;button onclick=&quot;document.querySelectorAll('.vsection').forEach(s=&gt;s.classList.remove('open'))&quot;&gt;Свернуть всё&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection open&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;🩸&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Обзор: венозный отток от головы и шеи&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;Венозная кровь от головы и шеи оттекает по трём основным магистралям в систему верхней полой вены (v. cava superior).&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Три главные яремные вены&lt;/div&gt;&lt;div class=&quot;vschema&quot;&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #4361ee;background:#4361ee12&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#4361ee&quot;&gt;V. jugularis interna&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Самая крупная. Собирает кровь от мозга, глазницы, внутреннего уха, лица, шеи&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #7209b7;background:#7209b712&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#7209b7&quot;&gt;V. jugularis externa&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Самая крупная подкожная вена шеи. Отток от затылка, кожи и мышц шеи&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #f72585;background:#f7258512&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#f72585&quot;&gt;V. jugularis anterior&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Парная. Отток от передней области шеи и подбородка&lt;/div&gt;
      &lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;vkeypoint&quot;&gt;V. subclavia + V. jugularis interna → венозный угол Пирогова → V. brachiocephalica → V. cava superior → правое предсердие&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;🧠&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Синусы твёрдой мозговой оболочки&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;Синусы (sinus durae matris) — каналы в расщеплениях твёрдой мозговой оболочки, выстланные эндотелием. Особенности: треугольная форма на разрезе, НЕ спадаются, НЕТ клапанов → свободный отток крови независимо от внутричерепного давления.&lt;/p&gt;
    &lt;div class=&quot;vtable-wrap&quot;&gt;&lt;table class=&quot;vtable&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Синус&lt;/th&gt;&lt;th&gt;Расположение&lt;/th&gt;&lt;th&gt;Куда впадает&lt;/th&gt;&lt;th&gt;Что принимает&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr class=&quot;even&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus sagittalis superior&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Верхний край серпа мозга, от for. caecum до protuberantia occipitalis int.&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Confluens sinuum&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Поверхностные вены полушарий, vv. diploicae&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus sagittalis inferior&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Нижний край серпа мозга&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sinus rectus&lt;/td&gt;&lt;td class=&quot;&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;even&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus rectus&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Место прикрепления серпа к намёту мозжечка&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Confluens sinuum&lt;/td&gt;&lt;td class=&quot;&quot;&gt;V. cerebri magna (Галена) + sinus sagittalis inferior&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus transversus&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sulcus sinus transversi затылочной кости&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sinus sigmoideus&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Из confluens sinuum&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;even&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus sigmoideus (парный)&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Одноим. борозда височной, теменной, затылочной костей&lt;/td&gt;&lt;td class=&quot;&quot;&gt;V. jugularis interna (через for. jugulare)&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Из sinus transversus&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus occipitalis&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Основание серпа мозжечка&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sinus sigmoideus&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Связь с vertebral venous plexus&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;even&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus cavernosus (парный)&lt;/td&gt;&lt;td class=&quot;&quot;&gt;По бокам от турецкого седла&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sinus petrosus sup. et inf.&lt;/td&gt;&lt;td class=&quot;&quot;&gt;V. ophthalmica sup., sinus sphenoparietalis. Через него: a. carotis int., n. abducens&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus intercavernosus ant. et post.&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Спереди и сзади от sella turcica&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Соединяют правый и левый sinus cavernosus&lt;/td&gt;&lt;td class=&quot;&quot;&gt;V. ophthalmica sup., plexus basilaris&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;even&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus sphenoparietalis (парный)&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Задний край малых крыльев os sphenoidale&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sinus cavernosus&lt;/td&gt;&lt;td class=&quot;&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus petrosus superior (парный)&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sulcus sinus petrosi sup.&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Соединяет sinus cavernosus и sinus sigmoideus&lt;/td&gt;&lt;td class=&quot;&quot;&gt;—&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;even&quot;&gt;&lt;td class=&quot;first&quot;&gt;Sinus petrosus inferior (парный)&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sulcus sinus petrosi inf.&lt;/td&gt;&lt;td class=&quot;&quot;&gt;V. jugularis interna&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Связь с plexus basilaris&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;vkeypoint&quot;&gt;Confluens sinuum (синусный сток) — место слияния sinus sagittalis sup., sinus rectus и sinus transversus у protuberantia occipitalis interna&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;💀&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Диплоические и эмиссарные вены&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;Диплоические вены (vv. diploicae) залегают в губчатом веществе костей свода черепа. Клапанов НЕТ → кровоток в ДВУХ направлениях. Связывают системы внутренней и наружной яремных вен.&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Основные диплоические вены&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;V. diploica frontalis — в чешуе лобной кости&lt;/li&gt;&lt;li&gt;Vv. diploicae temporales — в чешуе височной кости&lt;/li&gt;&lt;li&gt;V. diploica occipitalis — в чешуе затылочной кости&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;vtext&quot;&gt;Эмиссарные вены (vv. emissariae) — проходят через отверстия в костях черепа, соединяя синусы с наружными венами головы.&lt;/p&gt;
    &lt;div class=&quot;vtable-wrap&quot;&gt;&lt;table class=&quot;vtable&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Эмиссарная вена&lt;/th&gt;&lt;th&gt;Что соединяет&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr class=&quot;even&quot;&gt;&lt;td class=&quot;first&quot;&gt;V. emissaria parietalis (парная)&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Vv. temporales superficiales ↔ sinus sagittalis superior&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;&quot;&gt;&lt;td class=&quot;first&quot;&gt;V. emissaria mastoidea&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sinus sigmoideus ↔ v. occipitalis, v. diploica temporalis&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;even&quot;&gt;&lt;td class=&quot;first&quot;&gt;V. emissaria condylaris&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Sinus sigmoideus ↔ plexus venosus vertebralis ext., v. cervicalis profunda&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;&quot;&gt;&lt;td class=&quot;first&quot;&gt;V. emissaria occipitalis&lt;/td&gt;&lt;td class=&quot;&quot;&gt;Vv. occipitales ↔ sinus transversus / confluens sinuum&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;vkeypoint&quot;&gt;⚠️ Клинич. значение: отсутствие клапанов = двунаправленный кровоток = путь распространения инфекции из мягких тканей головы в полость черепа!&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;🔬&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Вены головного мозга&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;Вены головного мозга (vv. cerebri) делятся на поверхностные и глубокие.&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Поверхностные мозговые вены&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;Vv. cerebri superficiales superiores, mediae et inferiores — от коры полушарий → в близлежащие синусы&lt;/li&gt;&lt;li&gt;Vv. cerebelli → sinus transversus и sinus petrosus inferior&lt;/li&gt;&lt;/ul&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Глубокие мозговые вены&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;V. cerebri magna (Галена) — короткий ствол (0,5–1 см), слияние глубоких вен → sinus rectus&lt;/li&gt;&lt;li&gt;V. basalis — от subst. perforata ant., вдоль tr. opticus → v. cerebri magna&lt;/li&gt;&lt;li&gt;Vv. choroideae sup. et inf. — из сосудистых сплетений боковых желудочков → v. cerebri magna&lt;/li&gt;&lt;li&gt;Vv. cerebri internae — от белого вещества, стенок желудочков, thalamus, nuclei basales → v. cerebri magna → sinus rectus&lt;/li&gt;&lt;li&gt;Вены ствола: vv. pontomesencephales, vv. pontis, vv. medullae oblongatae&lt;/li&gt;&lt;li&gt;Вены мозжечка: v. vermis sup./inf., vv. cerebelli sup./inf.&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;👁️&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Вены глазницы и лабиринта&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;От глазницы, лобной области и частично верхней челюсти кровь оттекает по глазным венам в пещеристый синус.&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;V. ophthalmica superior — притоки:&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;V. nasofrontalis (лоб, наружный нос; анастомоз с v. angularis — корень лицевой вены!)&lt;/li&gt;&lt;li&gt;Vv. ethmoidales (слизистая решётчатой кости)&lt;/li&gt;&lt;li&gt;Vv. lacrimales (слёзная железа)&lt;/li&gt;&lt;li&gt;Vv. palpebrales (веки)&lt;/li&gt;&lt;li&gt;Вены глазного яблока: vv. conjunctivae, vv. vorticosae, vv. ciliares, vv. episclerales, v. centralis retinae&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;vtext&quot;&gt;V. ophthalmica superior → через fissura orbitalis superior → sinus cavernosus (БЕЗ клапанов!)&lt;/p&gt;
    &lt;p class=&quot;vtext&quot;&gt;V. ophthalmica inferior: от слёзного мешка, мышц глаза → делится на 2 ствола: один в sinus cavernosus, другой через fiss. orbitalis inf. → v. faciei profunda. Анастомоз с plexus pterygoideus.&lt;/p&gt;
    &lt;div class=&quot;vkeypoint&quot;&gt;⚠️ Клапаны ОТСУТСТВУЮТ → кровь может идти из вен лица в sinus cavernosus и обратно. При воспалении — путь инфекции от зубов, sinus maxillaris, носа, глазницы в пещеристый синус!&lt;/div&gt;
    &lt;p class=&quot;vtext&quot;&gt;Vv. labyrinthici — от внутреннего уха через meatus acusticus internus → sinus petrosus inferior.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;🔵&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Внутренняя яремная вена (V. jugularis interna)&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;Самый крупный венозный ствол шеи (∅ 12–20 мм). Начинается в for. jugulare как продолжение sinus sigmoideus. Идёт в составе сосудисто-нервного пучка шеи ЛАТЕРАЛЬНЕЕ a. carotis communis и n. vagus.&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Особенности:&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;Верхняя луковица (bulbus v. jugularis sup.) — у начала&lt;/li&gt;&lt;li&gt;Нижняя луковица (bulbus v. jugularis inf.) — у конца&lt;/li&gt;&lt;li&gt;1–3 полулунных клапана в устье, на остальном протяжении клапанов НЕТ&lt;/li&gt;&lt;li&gt;Окружена париетальным листком внутришейной фасции&lt;/li&gt;&lt;/ul&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Внутричерепные притоки&lt;/div&gt;&lt;div class=&quot;vschema&quot;&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #4361ee;background:#4361ee12&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#4361ee&quot;&gt;I. Синусы твёрдой оболочки&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;11 синусов → через for. jugulare&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #3a86ff;background:#3a86ff12&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#3a86ff&quot;&gt;II. Vv. diploicae&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Из губчатого вещества костей свода&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #8338ec;background:#8338ec12&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#8338ec&quot;&gt;III. Vv. emissariae&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Через отверстия в костях черепа&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #ff006e;background:#ff006e12&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#ff006e&quot;&gt;IV. Сплетения основания черепа&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Вокруг for. ovale, canalis hypoglossalis, canalis caroticus и др.&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #fb5607;background:#fb560712&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#fb5607&quot;&gt;V. Вены dura mater&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Свод → sinus sagittalis sup.; основание → синусы основания&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #ffbe0b;background:#ffbe0b12&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#ffbe0b&quot;&gt;VI. Vv. cerebri&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Поверхностные и глубокие вены мозга&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #06d6a0;background:#06d6a012&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#06d6a0&quot;&gt;VII. Вены глазницы&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;V. ophthalmica sup. et inf. → sinus cavernosus&lt;/div&gt;
      &lt;/div&gt;&lt;div class=&quot;vschema-item&quot; style=&quot;border-left:4px solid #118ab2;background:#118ab212&quot;&gt;
        &lt;div class=&quot;vschema-name&quot; style=&quot;color:#118ab2&quot;&gt;VIII. Vv. labyrinthici&lt;/div&gt;
        &lt;div class=&quot;vschema-desc&quot;&gt;Внутреннее ухо → sinus petrosus inferior&lt;/div&gt;
      &lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Внечерепные притоки V. jugularis interna:&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;1. Vv. pharyngeae — от plexus pharyngeus на стенке глотки&lt;/li&gt;&lt;li&gt;2. V. lingualis — из vv. dorsales linguae, v. profunda linguae, v. sublingualis → общий ствол у корня языка&lt;/li&gt;&lt;li&gt;3. V. facialis — из v. supraorbitalis + v. angularis; собирает от век, губ, носа, нёба, околоушной железы&lt;/li&gt;&lt;li&gt;4. V. retromandibularis — из височных вен; принимает vv. maxillares (из plexus pterygoideus)&lt;/li&gt;&lt;li&gt;5. V. thyroidea superior — от верхнего отдела щитовидной железы; принимает vv. sternocleidomastoideae и v. laryngea superior&lt;/li&gt;&lt;li&gt;6. V. thyroidea media — от перешейка щитовидной железы&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;🟣&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Наружная и передняя яремные вены&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;V. jugularis externa — самая крупная ПОДКОЖНАЯ вена шеи. Покрыта только поверхностной фасцией и platysma.&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Образование:&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;Передний корень — анастомоз с v. retromandibularis&lt;/li&gt;&lt;li&gt;Задний корень — слияние v. occipitalis + v. auricularis posterior позади ушной раковины&lt;/li&gt;&lt;li&gt;Соединяются у переднего края m. sternocleidomastoideus на уровне angulus mandibulae&lt;/li&gt;&lt;/ul&gt;
    &lt;p class=&quot;vtext&quot;&gt;Впадает в венозный угол (v. subclavia + v. jugularis interna).&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Притоки V. jugularis externa:&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;1. V. auricularis posterior — из сплетения позади уха; связь с v. emissaria mastoidea&lt;/li&gt;&lt;li&gt;2. V. occipitalis — из венозных сплетений затылка&lt;/li&gt;&lt;li&gt;3. V. cervicalis subcutanea posterior — от затылочной области&lt;/li&gt;&lt;li&gt;4. V. transversa colli + V. suprascapularis — сопровождают одноим. артерии&lt;/li&gt;&lt;/ul&gt;
    &lt;div class=&quot;vkeypoint&quot;&gt;V. jugularis externa отводит кровь от: затылочной области головы + кожи и мышц шеи&lt;/div&gt;
    &lt;p class=&quot;vtext&quot;&gt;V. jugularis anterior — парная, от подбородка и области os hyoideum вниз по m. mylohyoideus и m. sternohyoideus. Входит в spatium interaponeuroticum suprasternale, где обе vv. jugulares anteriores соединяются поперечным анастомозом → arcus venosus juguli. Иногда сливаются в v. mediana colli. Впадает в v. jugularis externa или v. subclavia.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;🔴&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Подключичная вена и плечеголовные вены&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;V. subclavia — от латерального края I ребра до слияния с v. jugularis interna. Имеет клапаны. Стенка сращена с фасцией, надкостницей I ребра и сухожилием m. scalenus anterior → просвет НЕ спадается.&lt;/p&gt;
    &lt;div class=&quot;vkeypoint&quot;&gt;⚠️ При повреждении v. subclavia — риск воздушной эмболии (из-за несмыкания стенок)&lt;/div&gt;
    &lt;p class=&quot;vtext&quot;&gt;Vv. brachiocephalicae (правая и левая) — ∅ 15–17 мм. Образуются из v. subclavia + v. jugularis interna. Правая — 2–3 см, вертикально. Левая — вдвое длиннее, тоньше, перекрывает ветви дуги аорты.&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Притоки vv. brachiocephalicae:&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;1. V. thyroidea inferior — из plexus thyroideus; от щитовидной железы, гортани, трахеи, глотки, пищевода&lt;/li&gt;&lt;li&gt;2. V. thyroidea impar — от plexus thyroideus impar → чаще в v. brachiocephalica sinistra&lt;/li&gt;&lt;li&gt;3. Vv. pericardiacophrenicae — в составе сос.-нерв. пучка с n. phrenicus&lt;/li&gt;&lt;li&gt;4. Vv. mediastinales — от тимуса, перикарда, бронхов, трахеи, пищевода&lt;/li&gt;&lt;li&gt;5. V. cervicalis profunda — от plexus venosus vertebralis ext.&lt;/li&gt;&lt;li&gt;6. V. vertebralis — от plexus venosus vertebralis + plexus suboccipitalis → через foramina transversaria шейных позвонков&lt;/li&gt;&lt;li&gt;7. Vv. thoracicae internae — вены-спутницы a. thoracica interna&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vsection&quot;&gt;
  &lt;button class=&quot;vsection-btn&quot; onclick=&quot;this.parentElement.classList.toggle('open')&quot;&gt;
    &lt;span class=&quot;icon&quot;&gt;⚕️&lt;/span&gt;
    &lt;span class=&quot;title&quot;&gt;Клинические анастомозы и пути оттока&lt;/span&gt;
    &lt;span class=&quot;arrow&quot;&gt;▾&lt;/span&gt;
  &lt;/button&gt;
  &lt;div class=&quot;vsection-body&quot;&gt;
    &lt;p class=&quot;vtext&quot;&gt;Венозная система головы и шеи имеет множество анастомозов, которые обеспечивают коллатеральный отток, но одновременно создают пути распространения инфекции.&lt;/p&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Важнейшие анастомозы:&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;V. angularis (начало v. facialis) ↔ v. nasofrontalis (приток v. ophthalmica sup.) → sinus cavernosus — ОПАСНЫЙ ТРЕУГОЛЬНИК ЛИЦА&lt;/li&gt;&lt;li&gt;V. faciei profunda ↔ plexus pterygoideus ↔ sinus cavernosus (через vv. emissariae)&lt;/li&gt;&lt;li&gt;V. ophthalmica inf. ↔ plexus pterygoideus — двусторонний ток (нет клапанов!)&lt;/li&gt;&lt;li&gt;Vv. diploicae ↔ синусы ↔ наружные вены (двунаправленный ток)&lt;/li&gt;&lt;li&gt;Vv. emissariae — прямая связь синусов с наружными венами&lt;/li&gt;&lt;li&gt;Plexus basilaris ↔ sinus intercavernosus post. ↔ sinus petrosus inf. ↔ plexus venosus vertebralis int. — второй путь оттока из черепа по позвоночным венам&lt;/li&gt;&lt;li&gt;Plexus pharyngeus ↔ менингеальные вены ↔ вены нёба ↔ plexus venosus vertebralis&lt;/li&gt;&lt;/ul&gt;
    &lt;div class=&quot;vkeypoint&quot;&gt;«Опасный треугольник лица» (область носа и верхней губы): инфекция через v. angularis → v. ophthalmica → sinus cavernosus → тромбоз пещеристого синуса!&lt;/div&gt;
    &lt;div class=&quot;vlist-title&quot;&gt;Два основных пути оттока крови из полости черепа:&lt;/div&gt;&lt;ul class=&quot;vlist&quot;&gt;&lt;li&gt;① Основной путь: синусы → v. jugularis interna (через for. jugulare)&lt;/li&gt;&lt;li&gt;② Дополнительный: plexus basilaris → plexus venosus vertebralis int. → vv. vertebrales&lt;/li&gt;&lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;vfooter&quot;&gt;Источник: Методическое пособие по спланхнологии и сосудистой анатомии&lt;/div&gt;
&lt;/body&gt;
